# Generato dal workflow "Pubblica avvisi": l'id dell'archivio KV viene inserito al momento della pubblicazione
name = "pumpy-avvisi"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
ORIGINE = "https://francesco-cerulli.github.io"
PERCORSO = "/pieno-giusto/"
REPO = "francesco-cerulli/pieno-giusto"

[[kv_namespaces]]
binding = "ISCRITTI"
id = "__KV_ID__"

# ogni ora al minuto 17 (e in più la mattina al 47): sollecita i prezzi se tardano, poi avvisa chi deve (una volta al giorno)
[triggers]
crons = ["17 * * * *", "47 6-9 * * *"]
