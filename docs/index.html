<style>
/* Layout: telefono = mappa a tutto schermo con comandi sopra e foglio dal basso;
   tablet verticale = pannello flottante; PC/tablet orizzontale = barra laterale fissa;
   21:9 = barra laterale + mappa + colonna con l'andamento nazionale.
   Marchio Pumpy: verde goccia, inchiostro, menta; Figtree; angoli morbidi, niente maiuscoletto. */
:root {
  --bg: #f2f3f0;          /* sfondo sotto la mappa */
  --surface: #ffffff;
  --surface-2: #f1f5f2;
  --fg: #0b1f17;          /* inchiostro */
  --muted: #56695f;
  --line: #dde5e0;
  --brand: #0e9f6e;       /* verde Pumpy (logo, segnaposti) */
  --accent: #0b8a5e;      /* verde per pulsanti con testo bianco */
  --accent-fg: #ffffff;
  --mint: #eaf7f0;
  --up: #c2410c;          /* prezzo in aumento */
  --down: #0b7a53;        /* prezzo in calo */
  --shadow: 0 4px 18px rgb(11 31 23 / .10);
  --tiles: none;
  --r: 18px;
  --f-display: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1310; --surface: #121c18; --surface-2: #1a2621; --fg: #eaf2ee; --muted: #93a69d;
  --line: #26352f; --brand: #2bc48a; --accent: #2bc48a; --accent-fg: #04140d; --mint: #12301f; --up: #ff8a4c; --down: #3dd68c;
  --shadow: 0 6px 24px rgb(0 0 0 / .45); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0b1310; --surface: #121c18; --surface-2: #1a2621; --fg: #eaf2ee; --muted: #93a69d;
  --line: #26352f; --brand: #2bc48a; --accent: #2bc48a; --accent-fg: #04140d; --mint: #12301f; --up: #ff8a4c; --down: #3dd68c;
  --shadow: 0 6px 24px rgb(0 0 0 / .45); color-scheme: dark; }

html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 var(--f-body); overflow: hidden; }
button, input { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#mappa { position: absolute; inset: 0; background: var(--bg); min-height: 0; }
.leaflet-tile-pane { filter: var(--tiles); }

/* --- struttura --- */
.app { position: fixed; inset: 0; }
.lato { position: absolute; inset: 0; z-index: 1000; pointer-events: none; display: flex; flex-direction: column;
  justify-content: space-between; gap: 10px; padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px 0; }
.lato > * { pointer-events: auto; }
.testa { display: flex; flex-direction: column; gap: 8px; max-width: 560px; }
.panoramica { display: none; }

/* --- barra in alto --- */
.riga { display: flex; gap: 8px; align-items: center; }
.marchio { font: 700 1.1rem/1 var(--f-display);  
  background: var(--accent); color: var(--accent-fg); padding: 10px 9px; border-radius: var(--r); box-shadow: var(--shadow); white-space: nowrap; }

.cerca { flex: 1; min-width: 0; display: flex; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); }
.cerca input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 9px 12px; }
.cerca input:focus-visible { outline-offset: -2px; border-radius: var(--r); }
.btn-icona { border: 0; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow);
  width: 40px; height: 38px; display: grid; place-items: center; cursor: pointer; flex: none; }
.btn-icona svg { width: 20px; height: 20px; stroke: var(--fg); }

.carburanti { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface);
  border-radius: var(--r); box-shadow: var(--shadow); padding: 3px; gap: 3px; }
.carburanti button { border: 0; background: transparent; border-radius: 8px; padding: 6px 4px; cursor: pointer;
  font: 600 .95rem/1.1 var(--f-display);   color: var(--muted); }
.carburanti button:hover { color: var(--fg); }
.carburanti button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.carburanti small { display: block; font: 500 .8rem/1.2 var(--f-body); letter-spacing: 0; text-transform: none; font-variant-numeric: tabular-nums; }

.avviso { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 8px 12px; font-size: .88rem; }

/* --- tendenza: "conviene fare il pieno adesso?" --- */
.tendenza { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 4px 12px;
  margin: 0 0 2px; padding: 10px 10px 10px 12px; border-radius: 12px; background: var(--surface-2); }
.tendenza .segno { width: 40px; height: 40px; border-radius: 999px; display: grid; place-items: center;
  font: 700 1.35rem/1 var(--f-body); background: var(--muted); color: var(--surface); }
.tendenza.su { background: color-mix(in srgb, var(--up) 13%, var(--surface)); }
.tendenza.su .segno { background: var(--up); }
.tendenza.giu { background: color-mix(in srgb, var(--down) 13%, var(--surface)); }
.tendenza.giu .segno { background: var(--down); }
.tendenza .testo { min-width: 0; line-height: 1.25; }
.tendenza .titolo { font: 600 1.1rem/1.15 var(--f-display);   }
.tendenza.su .titolo { color: var(--up); } .tendenza.giu .titolo { color: var(--down); }
.tendenza .dove, .tendenza .numeri { display: block; font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tendenza .dove b { color: var(--fg); font-weight: 600; }
.tendenza .consiglio { grid-column: 2 / 3; font-weight: 600; font-size: .9rem; }
.tendenza .info { grid-column: 3; grid-row: 1 / span 2; align-self: start; border: 1px solid var(--line); background: var(--surface);
  color: var(--muted); width: 30px; height: 30px; border-radius: 999px; cursor: pointer; font-weight: 700; }
.tendenza .info:hover { color: var(--fg); }

/* --- installazione come app --- */

.guida > div { background: var(--surface); color: var(--fg); border-radius: 16px; padding: 18px 18px calc(env(safe-area-inset-bottom, 0px) + 16px); width: min(460px, 100%); box-shadow: var(--shadow); }

  background: var(--surface); color: var(--fg); border: 1.5px solid var(--line); border-radius: 7px;
  padding: 1px 6px; font: 600 14px/1.25 var(--f-display); font-variant-numeric: tabular-nums; box-shadow: 0 2px 6px rgb(0 0 0 / .18); }

  border: 5px solid transparent; border-top-color: var(--line); border-bottom: 0; }

  background: color-mix(in srgb, var(--up) 12%, var(--surface)); color: var(--fg); text-align: left; }

.su { color: var(--up); } .giu { color: var(--down); }
.gruppo { display: grid; place-items: center; transform: translate(-50%, -50%);
  background: var(--accent); color: var(--accent-fg); border-radius: 999px; border: 2px solid var(--surface);
  font: 600 13px/1.05 var(--f-display); text-align: center; box-shadow: 0 2px 8px rgb(0 0 0 / .25); font-variant-numeric: tabular-nums; }

/* --- pannello "più economici": foglio dal basso su telefono --- */
.pannello { margin: 0 -12px; background: var(--surface); border-radius: 16px 16px 0 0; box-shadow: var(--shadow);
  padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 10px); display: flex; flex-direction: column;
  max-height: 46%; min-height: 0; }

  display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 9px 4px; text-align: left; border-radius: 0; }

.vuoto { color: var(--muted); padding: 10px 0; }
.fonte { color: var(--muted); font-size: .75rem; padding-top: 8px; border-top: 1px solid var(--line); }
.fonte a { color: inherit; }

/* --- tablet in verticale: pannello flottante in basso a sinistra --- */
@media (min-width: 700px) {

}

<div id="avvio" aria-hidden="true"><div class="scena">
  <div class="parola"><span>p</span><span>u</span><span>m</span><span>p</span><span>y</span></div>
  <svg viewBox="0 0 100 100"><path d="M50 8C50 8 18 46 18 64a32 32 0 0 0 64 0C82 46 50 8 50 8Z" fill="#fff"/><path class="chevron" d="M36 58l14 14 14-14" fill="none" stroke="var(--brand)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>
</div></div>
<script>
// Avvio: le lettere salgono, poi convergono al centro e si fondono nella goccia,
// che rimbalza, disegna la freccia e si apre sull'app. Circa 2 secondi; saltata con "riduci movimento".
(() => {
  const av = document.getElementById("avvio");
  const via = () => av && av.remove();
  if (!av || matchMedia("(prefers-reduced-motion: reduce)").matches || !av.animate) { via(); return; }
  setTimeout(via, 4000);   // rete di sicurezza
  const lettere = [...av.querySelectorAll(".parola span")], goccia = av.querySelector("svg"), freccia = av.querySelector(".chevron");
  const morbido = "cubic-bezier(.22,1,.36,1)", rimbalzo = "cubic-bezier(.34,1.56,.64,1)";
  lettere.forEach((l, k) => l.animate([{ opacity: 0, transform: "translateY(40%)" }, { opacity: 1, transform: "none" }],
    { duration: 420, delay: 60 * k, easing: morbido, fill: "forwards" }));
  setTimeout(() => {
    const c = av.querySelector(".scena").getBoundingClientRect(), cx = c.left + c.width / 2;
    lettere.forEach((l, k) => {
      const r = l.getBoundingClientRect(), dx = cx - (r.left + r.width / 2);
      l.animate([{ opacity: 1, transform: "none", filter: "blur(0)" },
                 { opacity: 0, transform: `translateX(${dx}px) scale(.25)`, filter: "blur(6px)" }],
        { duration: 520, delay: 30 * Math.abs(k - 2), easing: "cubic-bezier(.55,0,.45,1)", fill: "forwards" });
    });
    goccia.animate([{ opacity: 0, transform: "scale(0) translateY(20%)" }, { opacity: 1, transform: "scale(1.12)", offset: .7 }, { opacity: 1, transform: "scale(1)" }],
      { duration: 560, delay: 280, easing: rimbalzo, fill: "forwards" });
    freccia.animate([{ strokeDashoffset: 60 }, { strokeDashoffset: 0 }], { duration: 320, delay: 720, easing: morbido, fill: "forwards" });
  }, 820);
  setTimeout(() => {
    goccia.animate([{ transform: "scale(1)" }, { transform: "scale(.85)" }, { transform: "scale(14)", opacity: 0 }],
      { duration: 520, easing: "cubic-bezier(.7,0,.2,1)", fill: "forwards" });
    av.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 360, delay: 200, easing: "ease-out", fill: "forwards" }).onfinish = via;
  }, 2150);
})();
</script>

<script>
"use strict";
const NOMI = { benzina: "Benzina", gasolio: "Gasolio", gpl: "GPL", metano: "Metano" };
const ZOOM_PREZZI = 11;     // da questo zoom in su i prezzi dei singoli distributori, sotto le medie di provincia
const MAX_SEGNAPOSTI = 400; // oltre, solo i più vicini al centro: la mappa resta istantanea
const RAGGIO_KM = 5;        // la lista "vicino a te" guarda prima entro 5 km
// Layout attivo: "lato" = barra laterale fissa (PC, tablet/telefono in orizzontale); "largo" = 21:9
const MQ_LATO = matchMedia("(min-width: 1024px), (orientation: landscape) and (max-height: 520px)");
const MQ_LARGO = matchMedia("(min-width: 1800px) and (min-aspect-ratio: 2/1)");
const stato = { carb: "benzina", impianti: [], medie: null, strato: null, comuni: new Map(), soglie: {}, centri: new Map(), pos: null, sel: null, detCarb: null };

const $ = (id) => document.getElementById(id);
const euro = (p) => p.toFixed(3).replace(".", ",");
const cent = (d) => (Math.abs(d) * 100).toFixed(1).replace(".", ",").replace(",0", "");
const dataIt = (s) => s ? s.slice(8, 10) + "/" + s.slice(5, 7) : "";
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function leggiPreferenza() { try { return localStorage.getItem("carburante"); } catch { return null; } }
function salvaPreferenza(c) { try { localStorage.setItem("carburante", c); } catch {} }

// Si riapre dove l'avevi lasciata; la prima volta sull'Italia (poi la posizione la porta sulla tua zona)
const vistaSalvata = (() => { try { return JSON.parse(localStorage.getItem("vista")); } catch { return null; } })();
const mappa = L.map("mappa", { zoomControl: false, minZoom: 5, maxZoom: 18 })
  .setView(vistaSalvata ? [vistaSalvata[0], vistaSalvata[1]] : [42.3, 12.6], vistaSalvata ? vistaSalvata[2] : 6);
L.control.zoom({ position: "bottomright" }).addTo(mappa);
stato.strato = L.layerGroup().addTo(mappa);
// Basi della mappa: "Strade" (stile navigatore), "Essenziale" (quasi solo strade), "Satellite".
// In tema scuro le prime due usano la versione scura nativa invece di invertire i colori.
const OSM = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';
const CARTO = OSM + ' &copy; <a href="https://carto.com/attributions">CARTO</a>';
const MQ_SCURO = matchMedia("(prefers-color-scheme: dark)");
function scuro() { const t = document.documentElement.dataset.theme; return t ? t === "dark" : MQ_SCURO.matches; }
// Sfondi senza chiave d'accesso (Esri). Se un giorno si aggiunge una chiave CARTO gratuita,
// basta scriverla qui sotto e "Strade"/"Essenziale" tornano allo stile CARTO.
const CARTO_KEY = "";
const ESRI = (servizio) => `https://server.arcgisonline.com/ArcGIS/rest/services/${servizio}/MapServer/tile/{z}/{y}/{x}`;
const ATTR_ESRI = "Mappa &copy; Esri, HERE, Garmin, &copy; OpenStreetMap";
const BASI = {
  // Essenziale: grigio chiaro con strade e nomi in un livello a parte, sopra lo sfondo
  essenziale: { nome: "Essenziale", strati: () => CARTO_KEY
      ? [{ url: `https://{s}.basemaps.cartocdn.com/${scuro() ? "dark_all" : "rastertiles/voyager"}/{z}/{x}/{y}{r}.png?key=${CARTO_KEY}`, attr: CARTO, sub: "abcd", classe: "base-tenue" }]
      : [{ url: ESRI(scuro() ? "Canvas/World_Dark_Gray_Base" : "Canvas/World_Light_Gray_Base"), attr: ATTR_ESRI, nativo: 16 },
         { url: ESRI(scuro() ? "Canvas/World_Dark_Gray_Reference" : "Canvas/World_Light_Gray_Reference"), attr: "", nativo: 16 }] },
  // Strade: a colori, stile navigatore
  strade: { nome: "Strade", strati: () => CARTO_KEY
      ? [{ url: `https://{s}.basemaps.cartocdn.com/${scuro() ? "dark_all" : "rastertiles/voyager"}/{z}/{x}/{y}{r}.png?key=${CARTO_KEY}`, attr: CARTO, sub: "abcd" }]
      : [{ url: ESRI("World_Street_Map"), attr: ATTR_ESRI, classe: scuro() ? "base-notte" : "" }] },
  satellite: { nome: "Satellite", strati: () => [
      { url: ESRI("World_Imagery"), attr: "Immagini &copy; Esri, Maxar, Earthstar Geographics" },
      { url: ESRI("Reference/World_Transportation"), attr: "" }] },
};
let base = null;
function leggiBase() { try { return localStorage.getItem("base-v2") || "essenziale"; } catch { return "essenziale"; } }
function scegliBase(k) {
  if (!BASI[k]) k = "essenziale";
  if (base) mappa.removeLayer(base);
  base = L.layerGroup(BASI[k].strati().map((x) => L.tileLayer(x.url, { maxZoom: 19, maxNativeZoom: x.nativo || 19,
    attribution: x.attr, subdomains: x.sub || "abc", className: x.classe || "" }))).addTo(mappa);
  base.chiave = k;
  try { localStorage.setItem("base-v2", k); } catch {}
  document.querySelectorAll("#basi button").forEach((x) => x.setAttribute("aria-pressed", x.dataset.b === k));
}
scegliBase(leggiBase());
MQ_SCURO.addEventListener("change", () => scegliBase(base.chiave));

function avviso(testo) { const a = $("avviso"); a.textContent = testo || ""; a.hidden = !testo; }

function freccia(delta) {
  if (!delta) return "";
  return delta > 0 ? '<span class="freccia su" aria-label="in aumento">▲</span>'
                   : '<span class="freccia giu" aria-label="in calo">▼</span>';
}

// Fasce di prezzo: il 25% più economico è "economico", il 25% più caro è "caro" (escluse le autostrade)
// Un prezzo è "da verificare" se è molto sotto la media della provincia (segnato dallo script)
// oppure se il gestore non lo aggiorna da più di 8 giorni.
const MAX_GIORNI = 8;
const PROVINCE = {"AG": "Agrigento", "AL": "Alessandria", "AN": "Ancona", "AO": "Aosta", "AP": "Ascoli Piceno", "AQ": "L'Aquila", "AR": "Arezzo", "AT": "Asti", "AV": "Avellino", "BA": "Bari", "BG": "Bergamo", "BI": "Biella", "BL": "Belluno", "BN": "Benevento", "BO": "Bologna", "BR": "Brindisi", "BS": "Brescia", "BT": "Barletta-Andria-Trani", "BZ": "Bolzano", "CA": "Cagliari", "CB": "Campobasso", "CE": "Caserta", "CH": "Chieti", "CL": "Caltanissetta", "CN": "Cuneo", "CO": "Como", "CR": "Cremona", "CS": "Cosenza", "CT": "Catania", "CZ": "Catanzaro", "EN": "Enna", "FC": "Forlì-Cesena", "FE": "Ferrara", "FG": "Foggia", "FI": "Firenze", "FM": "Fermo", "FR": "Frosinone", "GE": "Genova", "GO": "Gorizia", "GR": "Grosseto", "IM": "Imperia", "IS": "Isernia", "KR": "Crotone", "LC": "Lecco", "LE": "Lecce", "LI": "Livorno", "LO": "Lodi", "LT": "Latina", "LU": "Lucca", "MB": "Monza e Brianza", "MC": "Macerata", "ME": "Messina", "MI": "Milano", "MN": "Mantova", "MO": "Modena", "MS": "Massa-Carrara", "MT": "Matera", "NA": "Napoli", "NO": "Novara", "NU": "Nuoro", "OR": "Oristano", "PA": "Palermo", "PC": "Piacenza", "PD": "Padova", "PE": "Pescara", "PG": "Perugia", "PI": "Pisa", "PN": "Pordenone", "PO": "Prato", "PR": "Parma", "PT": "Pistoia", "PU": "Pesaro e Urbino", "PV": "Pavia", "PZ": "Potenza", "RA": "Ravenna", "RC": "Reggio Calabria", "RE": "Reggio Emilia", "RG": "Ragusa", "RI": "Rieti", "RM": "Roma", "RN": "Rimini", "RO": "Rovigo", "SA": "Salerno", "SI": "Siena", "SO": "Sondrio", "SP": "La Spezia", "SR": "Siracusa", "SS": "Sassari", "SU": "Sud Sardegna", "SV": "Savona", "TA": "Taranto", "TE": "Teramo", "TN": "Trento", "TO": "Torino", "TP": "Trapani", "TR": "Terni", "TS": "Trieste", "TV": "Treviso", "UD": "Udine", "VA": "Varese", "VB": "Verbano-Cusio-Ossola", "VC": "Vercelli", "VE": "Venezia", "VI": "Vicenza", "VR": "Verona", "VT": "Viterbo", "VV": "Vibo Valentia"};
const GIORNI_FRECCIA = 7;   // la freccia sul segnaposto compare solo per variazioni recenti
function giorniDa(s) { return Math.round((Date.parse(stato.aggiornato) - Date.parse(s)) / 864e5); }
function motivoDubbio(v) {
  if (!v) return "";
  if (v[4]) return "Molto più basso della media della provincia: potrebbe essere un listino vecchio o un errore del gestore.";
  if (giorniDa(v[3]) > MAX_GIORNI) return `Non aggiornato da ${giorniDa(v[3])} giorni.`;
  return "";
}
function affidabile(i, c = stato.carb) { const v = i.prezzi[c]; return !!v && !motivoDubbio(v); }

function calcolaSoglie() {
  for (const c of Object.keys(NOMI)) {
    const v = stato.impianti.filter((i) => affidabile(i, c) && !i.autostrada).map((i) => i.prezzi[c][0]).sort((a, b) => a - b);
    stato.soglie[c] = v.length ? [v[Math.floor(v.length * .25)], v[Math.floor(v.length * .75)]] : [0, 99];
  }
}
function fascia(p) { const [lo, hi] = stato.soglie[stato.carb]; return p <= lo ? "economico" : p >= hi ? "caro" : ""; }

// --- distanza in km tra due punti ---
function km(a, b) {
  const R = 6371, r = Math.PI / 180, dLat = (b.lat - a.lat) * r, dLon = (b.lon - a.lon) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const testoKm = (d) => d < 1 ? `${Math.round(d * 1000 / 50) * 50} m` : `${d.toFixed(1).replace(".", ",")} km`;

// --- segnaposti: solo i distributori dell'area inquadrata; da lontano, le medie per provincia ---
function iconaPrezzo(i) {
  const [p, d] = i.prezzi[stato.carb];
  const sel = stato.sel === i ? " scelto" : "";
  if (!affidabile(i)) return L.divIcon({ className: "", iconSize: null, html: `<div class="pin dubbio${sel}" title="Prezzo da verificare">${euro(p)}?</div>` });
  const dal = i.prezzi[stato.carb][2];
  const recente = d && dal && giorniDa(dal) <= GIORNI_FRECCIA;
  return L.divIcon({ className: "", iconSize: null, html: `<div class="pin ${fascia(p)}${sel}">${euro(p)}${recente ? freccia(d) : ""}</div>` });
}

function disegna() {
  stato.strato.clearLayers();
  const c = stato.carb, candidati = [];
  if (mappa.getZoom() < ZOOM_PREZZI) {
    for (const [prov, centro] of stato.centri) {
      const p = stato.medie?.province?.[prov]?.[c];
      if (!p) continue;
      const m = L.marker([centro.lat, centro.lon], { title: PROVINCE[prov] || prov, keyboard: true,
        icon: L.divIcon({ className: "", iconSize: null, html: `<div class="prov"><b>${prov}</b>${euro(p)}</div>` }) });
      m.on("click", () => mappa.setView([centro.lat, centro.lon], ZOOM_PREZZI + 1));
      m.prezzo = p; m.largo = 86;
      candidati.push(m);
    }
    piazza(candidati.sort((a, b) => a.prezzo - b.prezzo));
    return;
  }
  const centro = mappa.getCenter(), cc = { lat: centro.lat, lon: centro.lng };
  const b = mappa.getBounds().pad(0.2);
  let qui = stato.impianti.filter((i) => i.prezzi[c] && b.contains([i.lat, i.lon]));
  if (qui.length > MAX_SEGNAPOSTI) qui = qui.map((i) => [km(cc, i), i]).sort((x, y) => x[0] - y[0]).slice(0, MAX_SEGNAPOSTI).map((x) => x[1]);
  if (stato.sel && stato.sel.prezzi[c] && !qui.includes(stato.sel)) qui.push(stato.sel);
  // ordine di priorità: la pompa aperta, poi i prezzi affidabili dal più basso, infine quelli da verificare
  const peso = (i) => (stato.sel === i ? -1e3 : 0) + (affidabile(i) ? 0 : 1e3) + i.prezzi[c][0];
  qui.sort((a, b2) => peso(a) - peso(b2));
  for (const i of qui) {
    const m = L.marker([i.lat, i.lon], { icon: iconaPrezzo(i), title: i.bandiera || i.nome, zIndexOffset: stato.sel === i ? 900 : 0 });
    m.on("click", () => seleziona(i));
    m.largo = 66; m.sempre = stato.sel === i;
    candidati.push(m);
  }
  piazza(candidati);
}
// Mette i segnaposti in ordine e salta quelli che coprirebbero uno già piazzato (da zoom 16 si vedono tutti)
function piazza(lista) {
  const tutti = mappa.getZoom() >= 16, presi = [], H = 28;
  for (const m of lista) {
    const pt = mappa.latLngToContainerPoint(m.getLatLng()), w = m.largo;
    const box = [pt.x - w / 2, pt.y - H / 2, pt.x + w / 2, pt.y + H / 2];
    if (!tutti && !m.sempre && presi.some((b) => box[0] < b[2] && box[2] > b[0] && box[1] < b[3] && box[3] > b[1])) continue;
    presi.push(box);
    stato.strato.addLayer(m);
  }
}

// --- lista: i più economici vicino a te (entro pochi km), altrimenti nella zona inquadrata ---
function aggiornaLista() {
  if (stato.sel) return;
  const lista = $("lista"), c = stato.carb;
  const centro = mappa.getCenter(), cc = { lat: centro.lat, lon: centro.lng };
  let righe, titolo;
  const vicinoATe = stato.pos && km(stato.pos, cc) < 4;
  if (vicinoATe) {
    let raggio = RAGGIO_KM, vicini = [];
    while (raggio <= RAGGIO_KM * 4) {
      vicini = stato.impianti.filter((i) => affidabile(i) && km(stato.pos, i) <= raggio);
      if (vicini.length >= 5) break;
      raggio *= 2;
    }
    righe = vicini; titolo = `Vicino a te · entro ${raggio} km`;
  } else if (mappa.getZoom() >= ZOOM_PREZZI) {
    const b = mappa.getBounds();
    righe = stato.impianti.filter((i) => affidabile(i) && b.contains([i.lat, i.lon])); titolo = "In questa zona";
  } else {
    $("titoloLista").textContent = "Avvicinati";
    $("conteggio").textContent = "";
    lista.innerHTML = '<li class="vuoto">Tocca una provincia o cerca un comune per vedere i prezzi.</li>';
    return;
  }
  righe.sort((a, b) => a.prezzi[c][0] - b.prezzi[c][0]);
  $("titoloLista").textContent = titolo;
  $("conteggio").textContent = righe.length ? `${righe.length} distributori` : "";
  if (!righe.length) { lista.innerHTML = '<li class="vuoto">Nessun distributore con questo carburante qui.</li>'; return; }
  const mostra = righe.slice(0, MQ_LATO.matches ? 50 : 20);
  lista.innerHTML = mostra.map((i, n) => {
    const [p, d, dal] = i.prezzi[c];
    const dist = stato.pos ? testoKm(km(stato.pos, i)) : "";
    return `<li><button type="button" data-n="${n}"><span class="nome">${esc(i.bandiera || i.nome)}</span>
      <span class="prezzo">${euro(p)}<small>${variazione(d, dal, false)}</small></span>
      <span class="dove">${dist ? `<b>${dist}</b> · ` : ""}${esc(i.indirizzo)}, ${esc(i.comune)}</span></button>
      <a class="nav-veloce" ${attrNav(i)} aria-label="Portami a ${esc(i.bandiera || i.nome)}" title="Portami qui">${ICONA_NAV}</a></li>`;
  }).join("");
  lista.querySelectorAll("button").forEach((btn) => btn.addEventListener("click", () => seleziona(mostra[+btn.dataset.n])));
}

// --- "Portami qui": un tocco apre la navigazione con l'app di mappe del telefono ---
// Android: link geo: → l'app predefinita (Google Maps, Waze…) o la scelta del sistema.
// iPhone/iPad: Mappe di Apple. PC: Google Maps nel browser. Si può fissare un'altra app dal pulsante "Cambia".
const UA = navigator.userAgent;
const IOS = /iPhone|iPad|iPod/.test(UA) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const ANDROID = /Android/.test(UA);
const NAVIGATORI = {
  auto: { nome: IOS ? "Mappe" : ANDROID ? "la tua app di mappe" : "Google Maps" },
  google: { nome: "Google Maps" }, apple: { nome: "Mappe di Apple" }, waze: { nome: "Waze" },
};
function navPreferito() { try { const v = localStorage.getItem("navigatore"); return NAVIGATORI[v] ? v : "auto"; } catch { return "auto"; } }
function linkNav(i, app = navPreferito()) {
  const ll = `${i.lat},${i.lon}`, nome = encodeURIComponent(i.bandiera || i.nome || "Distributore");
  if (app === "auto") app = IOS ? "apple" : ANDROID ? "geo" : "google";
  if (app === "geo") return `geo:${ll}?q=${ll}(${nome})`;
  if (app === "apple") return `https://maps.apple.com/?daddr=${ll}&dirflg=d`;
  if (app === "waze") return `https://waze.com/ul?ll=${ll}&navigate=yes`;
  return `https://www.google.com/maps/dir/?api=1&destination=${ll}&travelmode=driving`;
}
const ICONA_NAV = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg>';
function sceltaNavigatore(i) {
  const el = document.createElement("div");
  el.className = "guida"; el.setAttribute("role", "dialog"); el.setAttribute("aria-modal", "true"); el.setAttribute("aria-label", "Apri con");
  const voci = ["google", ...(IOS ? ["apple"] : []), "waze"];
  el.innerHTML = `<div><h2>Apri la navigazione con</h2>
    <div class="scelta-nav">${voci.map((k) => `<a class="voce-nav" data-k="${k}" href="${linkNav(i, k)}" target="_blank" rel="noopener">${NAVIGATORI[k].nome}</a>`).join("")}
    <a class="voce-nav" data-k="auto" href="${linkNav(i, "auto")}" ${IOS || ANDROID ? "" : 'target="_blank" rel="noopener"'}>Predefinita del telefono</a></div>
    <p class="nota">La scelta viene ricordata: la prossima volta basta un tocco.</p>
    <button type="button" class="annulla">Annulla</button></div>`;
  el.addEventListener("click", (e) => {
    const a = e.target.closest(".voce-nav");
    if (a) { try { localStorage.setItem("navigatore", a.dataset.k); } catch {} setTimeout(() => { el.remove(); if (stato.sel) disegnaDettaglio(); }, 300); return; }
    if (e.target === el || e.target.classList.contains("annulla")) el.remove();
  });
  document.body.appendChild(el);
  el.querySelector(".voce-nav").focus();
}
const attrNav = (i) => { const h = linkNav(i); return h.startsWith("geo:") ? `href="${h}"` : `href="${h}" target="_blank" rel="noopener"`; };

// --- dettaglio del distributore, nel pannello: prezzo, storico da leggere col dito, navigazione ---
const storici = new Map();
function caricaStorico(prov) {
  if (!storici.has(prov)) storici.set(prov, fetch(`data/storico/${prov}.json`, { cache: "no-cache" }).then((r) => r.ok ? r.json() : null).catch(() => null));
  return storici.get(prov);
}
const giornoDa = (inizio, k, lungo) => { const g = new Date(inizio); g.setDate(g.getDate() + k);
  return g.toLocaleDateString("it-IT", lungo ? { weekday: "short", day: "numeric", month: "long" } : { day: "numeric", month: "short" }); };

function seleziona(i, carb) {
  stato.sel = i; stato.detCarb = carb || (i.prezzi[stato.carb] ? stato.carb : Object.keys(NOMI).find((k) => i.prezzi[k]));
  chiudiMenu();
  const p = $("pannello");
  p.classList.add("con-dettaglio"); p.classList.remove("chiuso");
  $("dettaglio").hidden = false;
  disegnaDettaglio();
  // porta la pompa in vista, sopra il pannello su telefono
  const z = Math.max(mappa.getZoom(), 14);
  let punto = mappa.project([i.lat, i.lon], z);
  if (!MQ_LATO.matches) punto = punto.add([0, Math.min(p.getBoundingClientRect().height, innerHeight * .6) / 2]);
  mappa.setView(mappa.unproject(punto, z), z, { animate: true });
  disegna();
}
function chiudiDettaglio() {
  stato.sel = null;
  const p = $("pannello"); p.classList.remove("con-dettaglio");
  $("dettaglio").hidden = true; $("dettaglio").innerHTML = "";
  disegna(); aggiornaLista();
}

async function disegnaDettaglio() {
  const i = stato.sel, c = stato.detCarb; if (!i) return;
  const [p, d, dal] = i.prezzi[c];
  const dubbio = motivoDubbio(i.prezzi[c]);
  const t = stato.medie?.tendenze?.[i.provincia]?.[c];
  const chip = t ? `<span class="chip ${t[3]}">${t[3] === "su" ? "↑ zona in aumento" : t[3] === "giu" ? "↓ zona in calo" : "→ zona stabile"}</span>` : "";
  const altri = Object.keys(NOMI).filter((k) => i.prezzi[k])
    .map((k) => `<button type="button" data-c="${k}" aria-pressed="${k === c}">${NOMI[k]} <b>${euro(i.prezzi[k][0])}</b></button>`).join("");
  const dist = stato.pos ? ` · ${testoKm(km(stato.pos, i))} da te` : "";
  $("dettaglio").innerHTML = `<div class="det-testa">
      <button type="button" class="indietro" id="chiudiDettaglio" aria-label="Torna alla lista"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div><h3>${esc(i.bandiera || i.nome)}</h3><p class="dove">${esc(i.indirizzo)}, ${esc(i.comune)}${dist}</p></div></div>
    <div class="altri" role="group" aria-label="Carburante">${altri}</div>
    <div class="grande"><span class="cifra${dubbio ? " dubbio" : ""}">${euro(p)}<small>€/l</small></span>${chip}</div>
    ${dubbio ? `<div class="attenzione">Da verificare. ${dubbio}</div>` : ""}
    <figure class="storico" id="storico" aria-label="Storico del prezzo"><div class="attesa"></div></figure>
    <div class="nav-riga"><a class="vai" ${attrNav(i)}>${ICONA_NAV}<span>Portami qui<small>con ${NAVIGATORI[navPreferito()].nome}</small></span></a>
      <button type="button" class="cambia-nav" id="cambiaNav">Cambia app</button></div>
    <p class="puo-sbagliare">Pumpy può sbagliare: controlla sempre il prezzo alla pompa.</p>`;
  $("chiudiDettaglio").addEventListener("click", chiudiDettaglio);
  $("cambiaNav").addEventListener("click", () => sceltaNavigatore(i));
  $("dettaglio").querySelectorAll(".altri button").forEach((b) => b.addEventListener("click", () => { stato.detCarb = b.dataset.c; disegnaDettaglio(); }));
  const dati = await caricaStorico(i.provincia);
  if (stato.sel !== i || stato.detCarb !== c) return;
  graficoStorico($("storico"), dati, String(i.id), c);
}

// Grafico a gradini: ogni gradino è un cambio di prezzo. Scorrendo il dito (o il mouse) si legge giorno e prezzo.
function graficoStorico(fig, dati, id, c) {
  const punti = dati?.impianti?.[id]?.[c];
  if (!punti || !punti.length) { fig.innerHTML = '<p class="vuoto">Storico non ancora disponibile per questo distributore.</p>'; return; }
  const n = dati.giorni, W = 320, H = 150, T = 12, B = 18;
  const val = punti.map((x) => x[1] / 1000);
  let min = Math.min(...val), max = Math.max(...val);
  if (max - min < .02) { const m = (max + min) / 2; min = m - .01; max = m + .01; }
  const x = (k) => (k / Math.max(n - 1, 1)) * W, y = (v) => T + (1 - (v - min) / (max - min)) * (H - T - B);
  const k0 = punti[0][0];
  let d = `M${x(k0).toFixed(1)},${y(val[0]).toFixed(1)}`;
  for (let k = 1; k < punti.length; k++) d += `H${x(punti[k][0]).toFixed(1)}V${y(val[k]).toFixed(1)}`;
  d += `H${W}`;
  const cambi = punti.slice(1).map((pt, k) => `<circle class="cambio ${val[k + 1] > val[k] ? "su" : "giu"}" cx="${x(pt[0]).toFixed(1)}" cy="${y(val[k + 1]).toFixed(1)}" r="3.5" vector-effect="non-scaling-stroke"/>`).join("");
  const primo = val[0], ultimo = val[val.length - 1], diff = ultimo - primo, giorni = n - 1 - k0;
  const sintesi = Math.abs(diff) < .0005 ? `Fermo a ${euro(ultimo)} € negli ultimi ${giorni} giorni`
    : `<b class="${diff > 0 ? "var-su" : "var-giu"}">${diff > 0 ? "Salito" : "Sceso"} di ${cent(diff)} cent</b> in ${giorni} giorni · ${punti.length - 1} cambi di prezzo`;
  const descr = `Prezzo dal ${giornoDa(dati.inizio, k0)} a oggi: da ${euro(primo)} a ${euro(ultimo)} euro, minimo ${euro(Math.min(...val))}, massimo ${euro(Math.max(...val))}`;
  fig.innerHTML = `<figcaption class="sintesi">${sintesi}</figcaption>
    <div class="lettura" aria-live="polite"><span class="l-g">Oggi</span> <b class="l-p">${euro(ultimo)} €</b></div>
    <div class="area-g">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${descr}">
        <line class="griglia" x1="0" x2="${W}" y1="${y(max).toFixed(1)}" y2="${y(max).toFixed(1)}" vector-effect="non-scaling-stroke"/>
        <line class="griglia" x1="0" x2="${W}" y1="${y(min).toFixed(1)}" y2="${y(min).toFixed(1)}" vector-effect="non-scaling-stroke"/>
        <path class="area" d="${d}V${H - B}H${x(k0).toFixed(1)}Z"/>
        <path class="linea" d="${d}" vector-effect="non-scaling-stroke"/>
        ${cambi}
        <line class="cursore" x1="${W}" x2="${W}" y1="${T - 6}" y2="${H - B}" vector-effect="non-scaling-stroke"/>
      </svg>
      <span class="punto" style="left:100%;top:${(y(ultimo) / H * 100).toFixed(2)}%"></span>
      <span class="asse-y alto">${euro(max)}</span><span class="asse-y basso">${euro(min)}</span>
    </div>
    <div class="assi"><span>${giornoDa(dati.inizio, k0)}</span><span>oggi</span></div>`;
  const area = fig.querySelector(".area-g"), cur = fig.querySelector(".cursore"), pt = fig.querySelector(".punto");
  const lg = fig.querySelector(".l-g"), lp = fig.querySelector(".l-p");
  const prezzoAl = (k) => { let v = null; for (let j = 0; j < punti.length && punti[j][0] <= k; j++) v = val[j]; return v; };
  const leggi = (clientX) => {
    const r = area.getBoundingClientRect();
    const k = Math.max(k0, Math.min(n - 1, Math.round(((clientX - r.left) / r.width) * (n - 1))));
    const v = prezzoAl(k), xx = x(k);
    cur.setAttribute("x1", xx); cur.setAttribute("x2", xx);
    pt.style.left = `${(xx / W) * 100}%`; pt.style.top = `${(y(v) / H) * 100}%`;
    lg.textContent = k === n - 1 ? "Oggi" : giornoDa(dati.inizio, k, true); lp.textContent = `${euro(v)} €`;
  };
  const reset = () => leggi(area.getBoundingClientRect().right);
  area.addEventListener("pointerdown", (e) => { area.setPointerCapture(e.pointerId); leggi(e.clientX); });
  area.addEventListener("pointermove", (e) => leggi(e.clientX));
  area.addEventListener("pointerup", reset); area.addEventListener("pointerleave", reset); area.addEventListener("pointercancel", reset);
}

// --- colonna 21:9: andamento nazionale per carburante + riepilogo della zona inquadrata ---
function disegnaAndamento() {
  if (!stato.medie || !MQ_LARGO.matches) return;
  const serie = stato.medie.nazionale;
  $("periodo").textContent = `Dal ${dataIt(serie[0].giorno)} al ${dataIt(serie[serie.length - 1].giorno)} · prezzo self (GPL e metano servito)`;
  const W = 320, H = 46;
  $("trend").innerHTML = Object.keys(NOMI).map((c) => {
    const punti = serie.map((g) => g[c]).filter((v) => v != null);
    if (punti.length < 2) return "";
    const min = Math.min(...punti), max = Math.max(...punti), span = max - min || .01;
    const x = (k) => (k / (punti.length - 1)) * W, y = (v) => 4 + (1 - (v - min) / span) * (H - 8);
    const linea = punti.map((v, k) => `${k ? "L" : "M"}${x(k).toFixed(1)},${y(v).toFixed(1)}`).join("");
    const ultimo = punti[punti.length - 1], d = ultimo - punti[0];
    const testo = Math.abs(d) < .0005 ? `stabile in ${punti.length} giorni` : `${d > 0 ? "+" : "−"}${cent(d)} cent in ${punti.length} giorni ${freccia(d)}`;
    return `<button type="button" class="trend" data-c="${c}" aria-pressed="${c === stato.carb}">
      <span class="n">${NOMI[c]}</span><span class="v">${euro(ultimo)}</span>
      <span class="d" data-base="${esc(testo)}">${testo}</span>
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
        <line class="guida" x1="0" x2="${W}" y1="${H - .5}" y2="${H - .5}"/>
        <path class="area" d="${linea}L${W},${H}L0,${H}Z"/><path class="linea" d="${linea}" vector-effect="non-scaling-stroke"/>
        <line class="cursore" x1="0" x2="0" y1="0" y2="${H}" visibility="hidden" vector-effect="non-scaling-stroke"/>
        <circle class="fine" cx="${W}" cy="${y(ultimo).toFixed(1)}" r="4" vector-effect="non-scaling-stroke"/>
      </svg></button>`;
  }).join("");
  // passando sopra al grafico si legge il valore del giorno
  $("trend").querySelectorAll(".trend").forEach((b) => {
    const c = b.dataset.c, svg = b.querySelector("svg"), cur = b.querySelector(".cursore"), d = b.querySelector(".d");
    const giorni = serie.filter((g) => g[c] != null);
    svg.addEventListener("pointermove", (e) => {
      const r = svg.getBoundingClientRect(), k = Math.round(((e.clientX - r.left) / r.width) * (giorni.length - 1));
      const g = giorni[Math.max(0, Math.min(giorni.length - 1, k))];
      const xx = (giorni.indexOf(g) / (giorni.length - 1)) * W;
      cur.setAttribute("x1", xx); cur.setAttribute("x2", xx); cur.setAttribute("visibility", "visible");
      d.textContent = `${dataIt(g.giorno)}: ${euro(g[c])} €`;
    });
    svg.addEventListener("pointerleave", () => { cur.setAttribute("visibility", "hidden"); d.innerHTML = d.dataset.base; });
  });
}
$("trend").addEventListener("click", (e) => {
  const b = e.target.closest(".trend"); if (b && b.dataset.c !== stato.carb) scegliCarburante(b.dataset.c);
});

function aggiornaZona() {
  if (!stato.medie || !MQ_LARGO.matches) return;
  const z = $("zona");
  if (mappa.getZoom() < 9) { z.innerHTML = `<h3>Nella zona inquadrata</h3><div class="largo">Avvicinati sulla mappa per confrontare la zona con la media nazionale.</div>`; return; }
  const b = mappa.getBounds(), c = stato.carb;
  const qui = stato.impianti.filter((i) => i.prezzi[c] && b.contains([i.lat, i.lon]));
  const ok = qui.filter((i) => affidabile(i)).map((i) => i.prezzi[c][0]).sort((a, b2) => a - b2);
  if (!ok.length) { z.innerHTML = `<h3>Nella zona inquadrata</h3><div class="largo">Nessun prezzo di ${NOMI[c].toLowerCase()} affidabile qui.</div>`; return; }
  const media = ok.reduce((a, v) => a + v, 0) / ok.length;
  const naz = stato.medie.nazionale[stato.medie.nazionale.length - 1][c];
  const diff = media - naz;
  z.innerHTML = `<h3>Nella zona inquadrata · ${NOMI[c]}</h3>
    <div><span>Media della zona</span><b>${euro(media)}</b></div>
    <div><span>Rispetto all'Italia</span><b>${Math.abs(diff) < .0005 ? "uguale" : `${diff > 0 ? "+" : "−"}${cent(diff)} cent`}</b></div>
    <div><span>Il più economico</span><b>${euro(ok[0])}</b></div>
    <div><span>Il più caro</span><b>${euro(ok[ok.length - 1])}</b></div>
    <div class="largo">${ok.length} prezzi affidabili${qui.length > ok.length ? `, ${qui.length - ok.length} da verificare esclusi` : ""}. Tra il più economico e il più caro ci sono ${cent(ok[ok.length - 1] - ok[0])} cent al litro: ${((ok[ok.length - 1] - ok[0]) * 50).toFixed(2).replace(".", ",")} € su un pieno da 50 litri.</div>`;
}

// --- variazione del singolo distributore, in parole ---
function variazione(d, dal, lunga) {
  if (!d) return lunga ? "prezzo invariato negli ultimi giorni" : "invariato";
  const verso = d > 0 ? "su" : "giu";
  const quando = `il ${dataIt(dal)}`;   // data dei prezzi in cui compare per la prima volta il nuovo valore
  const testo = lunga ? `${d > 0 ? "Salito" : "Sceso"} di ${cent(d)} cent ${quando}` : `${d > 0 ? "+" : "−"}${cent(d)} cent ${quando}`;
  return `<span class="var-${verso}">${freccia(d)} ${testo}</span>`;
}

// --- tendenza della zona: dove stanno andando i prezzi medi ---
function zonaCorrente() {
  if (mappa.getZoom() < 9) return "IT";
  const c = mappa.getCenter(); let best = null, dist = Infinity;
  for (const i of stato.impianti) {
    const dd = (i.lat - c.lat) ** 2 + (i.lon - c.lng) ** 2;
    if (dd < dist) { dist = dd; best = i; }
  }
  return best && stato.medie?.tendenze?.[best.provincia] ? best.provincia : "IT";
}
function nomeZona(z) { return z === "IT" ? "in Italia" : `in provincia di ${PROVINCE[z] || z}`; }
const CONSIGLI = { su: "Meglio fare il pieno adesso", giu: "Se puoi, aspetta qualche giorno", stabile: "Nessuna fretta: i prezzi sono fermi" };
const TITOLI = { su: "in aumento", giu: "in calo", stabile: "stabile" };

function aggiornaTendenza() {
  const box = $("tendenza"), c = stato.carb, z = zonaCorrente();
  const t = stato.medie?.tendenze?.[z]?.[c] || stato.medie?.tendenze?.IT?.[c];
  if (!t) { box.hidden = true; return; }
  const [media, , d3, dir] = t;
  box.className = `tendenza ${dir}`; box.hidden = false;
  const segno = dir === "su" ? "↑" : dir === "giu" ? "↓" : "→";
  const numeri = dir === "stabile" ? `media ${euro(media)} €, quasi ferma negli ultimi 3 giorni`
    : `${d3 > 0 ? "+" : "−"}${cent(d3)} cent in 3 giorni · media ${euro(media)} €`;
  box.innerHTML = `<div class="segno" aria-hidden="true">${segno}</div>
    <div class="testo"><span class="titolo">${NOMI[c]} ${TITOLI[dir]}</span>
      <span class="dove">${CONSIGLI[dir]} · <b>${z === "IT" ? "Italia" : esc(PROVINCE[z] || z)}</b></span></div>
    <button type="button" class="info" id="tendenzaInfo" aria-label="Come funziona" title="${esc(numeri)}">?</button>`;
  $("tendenzaInfo").addEventListener("click", spiegaTendenza);
}

function zonaTesto(prov) {
  const t = stato.medie?.tendenze?.[prov]?.[stato.carb];
  if (!t) return "";
  const [, , d3, dir] = t;
  const frase = dir === "stabile" ? "prezzi medi stabili" : `prezzi medi ${TITOLI[dir]} (${d3 > 0 ? "+" : "−"}${cent(d3)} cent in 3 giorni)`;
  return `<div class="zona-t">${NOMI[stato.carb]} ${nomeZona(prov)}: <span class="${dir === "stabile" ? "" : "var-" + dir}">${frase}</span></div>`;
}

function spiegaTendenza() {
  const a = stato.medie?.affidabilita || {};
  const serie = (stato.medie?.nazionale || []).filter((g) => g[stato.carb] != null);
  let figura = "";

    const W = 300, H = 90, v = serie.map((g) => g[stato.carb]);
    const min = Math.min(...v), max = Math.max(...v), span = max - min || .01;
    const x = (k) => (k / (v.length - 1)) * W, y = (p) => 8 + (1 - (p - min) / span) * (H - 16);
    const linea = v.map((p, k) => `${k ? "L" : "M"}${x(k).toFixed(1)},${y(p).toFixed(1)}`).join("");

    figura = `<figure><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Media italiana della ${NOMI[stato.carb].toLowerCase()} negli ultimi ${v.length} giorni">

      <figcaption><span>${dataIt(serie[0].giorno)}</span><span>ultimi 3 giorni = la tendenza</span><span>${dataIt(serie[serie.length - 1].giorno)}</span></figcaption></figure>`;

      <div class="passo">${icona('<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>')}Ogni giorno</div><span class="freccia-f">›</span>
      <div class="passo">${icona('<path d="M4 17l5-5 4 3 7-8"/><path d="M15 7h5v5"/>')}Media e tendenza</div>
    </div>
    ${figura}
    ${a.percentuale != null ? `<p style="margin:0"><span class="affid">${a.percentuale}%</span> tendenze confermate nei ${a.orizzonte} giorni dopo</p>
      <div class="barra-aff" aria-hidden="true"><i style="width:${a.percentuale}%"></i></div>
      <p class="nota">${a.casi.toLocaleString("it-IT")} casi verificati in ${a.giorni} giorni.</p>` : ""}

    <button type="button">Ho capito</button></div>`;
  el.addEventListener("click", (e) => { if (e.target === el || e.target.tagName === "BUTTON") el.remove(); });

  el.querySelector("button").focus();

function vaiAComune(nome) {

// --- "sei qui": avatar sulla mappa, posizione seguita mentre l'app è aperta ---
const AVATAR = `<div class="avatar"><span class="alone"></span><span class="faccia"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16V11l2-5h10l2 5v5"/><path d="M4 11h16v5H4z"/><circle cx="7.5" cy="16.5" r="1.5"/><circle cx="16.5" cy="16.5" r="1.5"/></svg></span><span class="etichetta">Sei qui</span></div>`;
let osservatore = null, avatar = null, precisione = null, primaPosizione = true;
function aggiornaAvatar() {
  const p = [stato.pos.lat, stato.pos.lon];
  if (!avatar) {
    precisione = L.circle(p, { radius: stato.pos.acc, interactive: false, stroke: false, fillColor: "#0e9f6e", fillOpacity: .1 }).addTo(mappa);
    avatar = L.marker(p, { interactive: false, keyboard: false, zIndexOffset: 1000, icon: L.divIcon({ className: "", iconSize: null, html: AVATAR }) }).addTo(mappa);
  } else { avatar.setLatLng(p); precisione.setLatLng(p); }
  precisione.setRadius(Math.min(stato.pos.acc, 800));
}
function localizza(centra) {
  if (!navigator.geolocation) { if (centra) avviso("Il tuo browser non condivide la posizione: cerca il comune."); return; }
  if (centra && stato.pos) { if (stato.sel) chiudiDettaglio(); mappa.setView([stato.pos.lat, stato.pos.lon], 14); apriPannello(); return; }
  if (osservatore != null) return;
  osservatore = navigator.geolocation.watchPosition((pos) => {
    stato.pos = { lat: pos.coords.latitude, lon: pos.coords.longitude, acc: pos.coords.accuracy || 50 };
    aggiornaAvatar(); avviso("");
    if (primaPosizione) { primaPosizione = false; mappa.setView([stato.pos.lat, stato.pos.lon], 14); }
    else if (!stato.sel) aggiornaLista();
  }, (err) => {
    osservatore = null;
    if (centra || err.code !== 1) avviso(err.code === 1 ? "Posizione non concessa: cerca un comune, oppure consentila dalle impostazioni del browser." : "Posizione non disponibile al momento: cerca il comune.");
  }, { enableHighAccuracy: true, maximumAge: 30000, timeout: 20000 });
}
$("vicino").addEventListener("click", () => localizza(true));

async function carica() {
  try {
    const [ri, rm] = await Promise.all([fetch("data/impianti.json", { cache: "no-cache" }), fetch("data/medie.json", { cache: "no-cache" })]);
    if (!ri.ok) throw new Error(ri.status);
    const dati = await ri.json();
    stato.medie = rm.ok ? await rm.json() : null;
    stato.aggiornato = dati.aggiornato;
    stato.impianti = dati.impianti.map((r) => ({ id: r[0], nome: r[1], bandiera: r[2], indirizzo: r[3],
      comune: r[4], provincia: r[5], lat: r[6], lon: r[7], autostrada: r[8], prezzi: r[9] }));
    const somme = new Map();
    for (const i of stato.impianti) {
      const k = i.comune.toLowerCase();
      if (!stato.comuni.has(k)) stato.comuni.set(k, []);
      stato.comuni.get(k).push(i);
      if (!i.autostrada && i.provincia) {
        const s = somme.get(i.provincia) || { lat: 0, lon: 0, n: 0 };
        s.lat += i.lat; s.lon += i.lon; s.n++; somme.set(i.provincia, s);
      }
    }
    stato.centri = new Map([...somme].map(([p, s]) => [p, { lat: s.lat / s.n, lon: s.lon / s.n }]));
    const nomi = [...new Set(stato.impianti.map((i) => `${i.comune}`))].sort((a, b) => a.localeCompare(b, "it"));
    $("comuni").innerHTML = nomi.map((n) => `<option value="${esc(n)}"></option>`).join("");
    $("data").textContent = new Date(dati.aggiornato).toLocaleDateString("it-IT");
    calcolaSoglie();
    aggiornaMedie();
    const pref = leggiPreferenza();
    scegliCarburante(NOMI[pref] ? pref : "benzina");
    disegnaAndamento();
  } catch (err) {
    $("conteggio").textContent = "";
    avviso("Non riesco a caricare i prezzi. Riprova tra qualche minuto.");
    console.error(err);
  }
}
carica();
