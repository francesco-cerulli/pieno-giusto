<style>
/* Layout: telefono = mappa a tutto schermo con comandi sopra e foglio dal basso;
   tablet verticale = pannello flottante; PC/tablet orizzontale = barra laterale fissa;

   Tipografia da cartellone stradale (Barlow Condensed) per prezzi ed etichette. */
:root {
  --bg: #eef0ee;          /* sfondo sotto la mappa */
  --surface: #ffffff;
  --surface-2: #f3f5f4;
  --fg: #16201d;
  --muted: #5d6b67;
  --line: #d6dcda;
  --accent: #0d6b5c;      /* verde petrolio */
  --accent-fg: #ffffff;

  --bg: #121816; --surface: #1b2320; --surface-2: #232d29; --fg: #e8eeeb; --muted: #97a6a1;
  --line: #33403b; --accent: #3fb8a0; --accent-fg: #07201b; --up: #fb923c; --down: #4ade80;
  --shadow: 0 6px 24px rgb(0 0 0 / .45); --tiles: invert(1) hue-rotate(180deg) brightness(.85) contrast(.9); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121816; --surface: #1b2320; --surface-2: #232d29; --fg: #e8eeeb; --muted: #97a6a1;
  --line: #33403b; --accent: #3fb8a0; --accent-fg: #07201b; --up: #fb923c; --down: #4ade80;
  --shadow: 0 6px 24px rgb(0 0 0 / .45); --tiles: invert(1) hue-rotate(180deg) brightness(.85) contrast(.9); color-scheme: dark; }

html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 var(--f-body); overflow: hidden; }
button, input { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#mappa { position: absolute; inset: 0; background: var(--bg); min-height: 0; }
.leaflet-tile-pane { filter: var(--tiles); }

/* --- struttura --- */
.app { position: fixed; inset: 0; }
.lato { position: absolute; inset: 0; z-index: 1000; pointer-events: none; display: flex; flex-direction: column;
  justify-content: space-between; gap: 10px; padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px 0; }
.lato > * { pointer-events: auto; }
.testa { display: flex; flex-direction: column; gap: 8px; max-width: 560px; }
.panoramica { display: none; }

/* --- barra in alto --- */
.riga { display: flex; gap: 8px; align-items: center; }
.marchio { font: 700 1.1rem/1 var(--f-display); letter-spacing: .02em; text-transform: uppercase;
  background: var(--accent); color: var(--accent-fg); padding: 10px 9px; border-radius: 10px; box-shadow: var(--shadow); white-space: nowrap; }
@media (max-width: 380px) { .marchio { display: none; } }
.cerca { flex: 1; min-width: 0; display: flex; background: var(--surface); border-radius: 10px; box-shadow: var(--shadow); }
.cerca input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 9px 12px; }
.cerca input:focus-visible { outline-offset: -2px; border-radius: 10px; }
.btn-icona { border: 0; background: var(--surface); border-radius: 10px; box-shadow: var(--shadow);
  width: 40px; height: 38px; display: grid; place-items: center; cursor: pointer; flex: none; }
.btn-icona svg { width: 20px; height: 20px; stroke: var(--fg); }

.carburanti { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface);
  border-radius: 10px; box-shadow: var(--shadow); padding: 3px; gap: 3px; }
.carburanti button { border: 0; background: transparent; border-radius: 8px; padding: 6px 4px; cursor: pointer;
  font: 600 .95rem/1.1 var(--f-display); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.carburanti button:hover { color: var(--fg); }
.carburanti button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.carburanti small { display: block; font: 500 .8rem/1.2 var(--f-body); letter-spacing: 0; text-transform: none; font-variant-numeric: tabular-nums; }

.avviso { background: var(--surface); border-radius: 10px; box-shadow: var(--shadow); padding: 8px 12px; font-size: .88rem; }

/* --- installazione come app --- */

.installa .no { border: 0; background: transparent; color: var(--muted); cursor: pointer; width: 32px; height: 32px; font-size: 1.2rem; line-height: 1; }
.guida { position: fixed; inset: 0; z-index: 3000; background: rgb(0 0 0 / .5); display: grid; place-items: end center; padding: 16px; }
.guida > div { background: var(--surface); color: var(--fg); border-radius: 16px; padding: 18px 18px calc(env(safe-area-inset-bottom, 0px) + 16px); width: min(460px, 100%); box-shadow: var(--shadow); }
@media (min-width: 700px) { .guida { place-items: center; } }
.guida h2 { margin: 0 0 10px; font: 600 1.25rem/1.2 var(--f-display); text-transform: uppercase; letter-spacing: .04em; }
.guida ol { margin: 0 0 14px; padding-left: 1.3em; display: grid; gap: 8px; line-height: 1.4; }
.guida .nota { color: var(--muted); font-size: .85rem; margin: 0 0 14px; }

/* --- segnaposti con il prezzo --- */
.pin { position: relative; display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; transform: translate(-50%, -100%);
  background: var(--surface); color: var(--fg); border: 1.5px solid var(--line); border-radius: 7px;
  padding: 1px 6px; font: 600 14px/1.25 var(--f-display); font-variant-numeric: tabular-nums; box-shadow: 0 2px 6px rgb(0 0 0 / .18); }
.pin.economico { border-color: var(--down); }
.pin.caro { border-color: var(--up); }
.pin::after { content: ""; position: absolute; left: 50%; bottom: -6px; margin-left: -5px;
  border: 5px solid transparent; border-top-color: var(--line); border-bottom: 0; }
.pin.economico::after { border-top-color: var(--down); }
.pin.caro::after { border-top-color: var(--up); }
.pin.dubbio { color: var(--muted); border-style: dashed; background: var(--surface-2); font-weight: 500; }
.scheda .attenzione { margin-top: 4px; padding: 5px 7px; border-radius: 6px; font-size: .78rem; line-height: 1.35;
  background: color-mix(in srgb, var(--up) 12%, var(--surface)); color: var(--fg); text-align: left; }
.scheda .dubbio .p { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
.freccia { font-size: .72em; }
.su { color: var(--up); } .giu { color: var(--down); }
.gruppo { display: grid; place-items: center; transform: translate(-50%, -50%);
  background: var(--accent); color: var(--accent-fg); border-radius: 999px; border: 2px solid var(--surface);
  font: 600 13px/1.05 var(--f-display); text-align: center; box-shadow: 0 2px 8px rgb(0 0 0 / .25); font-variant-numeric: tabular-nums; }
.gruppo span { display: block; font-size: 10px; opacity: .85; font-weight: 500; }
.leaflet-div-icon { background: none; border: 0; }

/* --- pannello "più economici": foglio dal basso su telefono --- */
.pannello { margin: 0 -12px; background: var(--surface); border-radius: 16px 16px 0 0; box-shadow: var(--shadow);
  padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 10px); display: flex; flex-direction: column;
  max-height: 46%; min-height: 0; }
.maniglia { border: 0; background: transparent; cursor: pointer; padding: 10px 0 8px; display: flex; flex-direction: column; gap: 6px; text-align: left; width: 100%; }
.maniglia::before { content: ""; align-self: center; width: 38px; height: 4px; border-radius: 4px; background: var(--line); }
.maniglia h2 { margin: 0; font: 600 1.05rem/1.2 var(--f-display); text-transform: uppercase; letter-spacing: .05em; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.maniglia h2 span { color: var(--muted); font-weight: 500; text-transform: none; letter-spacing: 0; font-family: var(--f-body); font-size: .85rem; text-align: right; }
.lista { list-style: none; margin: 0; padding: 0; overflow-y: auto; min-height: 0; overscroll-behavior: contain; }
.pannello.chiuso .lista, .pannello.chiuso .fonte { display: none; }
.lista li button { width: 100%; border: 0; border-top: 1px solid var(--line); background: transparent; cursor: pointer;
  display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 9px 4px; text-align: left; border-radius: 0; }
.lista li button:hover { background: var(--surface-2); }
.lista .nome { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lista .dove { color: var(--muted); font-size: .85rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lista .prezzo { grid-row: span 2; align-self: center; text-align: right; font: 600 1.35rem/1 var(--f-display); font-variant-numeric: tabular-nums; }
.lista .prezzo small { display: block; font: 500 .75rem/1.3 var(--f-body); }
.vuoto { color: var(--muted); padding: 10px 0; }
.fonte { color: var(--muted); font-size: .75rem; padding-top: 8px; border-top: 1px solid var(--line); }
.fonte a { color: inherit; }

/* --- tablet in verticale: pannello flottante in basso a sinistra --- */
@media (min-width: 700px) {
  .lato { padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 0; }
  .pannello { margin: 0 0 calc(env(safe-area-inset-bottom, 0px) + 16px); width: 420px; border-radius: 16px; max-height: calc(100% - 200px); }
  .pannello.chiuso { width: 320px; }
}

/* --- PC, tablet in orizzontale e telefono in orizzontale: barra laterale fissa --- */
@media (min-width: 1024px), (orientation: landscape) and (max-height: 520px) {
  .app { display: grid; grid-template-columns: var(--lato-w, 360px) minmax(0, 1fr); }
  #mappa { position: relative; inset: auto; grid-column: 2; grid-row: 1; }
  .lato { position: relative; inset: auto; grid-column: 1; grid-row: 1; pointer-events: auto; min-height: 0;
    justify-content: flex-start; gap: 14px; background: var(--surface); border-right: 1px solid var(--line);
    padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px 0 calc(env(safe-area-inset-left, 0px) + 16px); }
  .testa { max-width: none; }
  .marchio, .cerca, .btn-icona, .carburanti, .avviso { box-shadow: none; }
  .cerca, .btn-icona, .carburanti, .avviso { background: var(--surface-2); }
  .pannello, .pannello.chiuso { flex: 1; width: auto; margin: 0; max-height: none; box-shadow: none; border-radius: 0; background: transparent; padding: 0 0 calc(env(safe-area-inset-bottom, 0px) + 12px); }
  .pannello.chiuso .lista, .pannello.chiuso .fonte { display: block; }
  .maniglia { cursor: default; padding-top: 0; }
  .maniglia::before { display: none; }
  .maniglia h2 { flex-direction: column; align-items: flex-start; gap: 2px; }
  .maniglia h2 span { text-align: left; }
  .riga { flex-wrap: wrap; }
  .marchio { flex-basis: 100%; background: transparent; color: var(--accent); padding: 0 0 2px; font-size: 1.5rem; }
  .leaflet-top.leaflet-right { top: 0; }
}
@media (orientation: landscape) and (max-height: 520px) {
  .app { --lato-w: 300px; }
  .lato { gap: 8px; padding-top: calc(env(safe-area-inset-top, 0px) + 8px); padding-left: calc(env(safe-area-inset-left, 0px) + 10px); padding-right: 10px; }
  .marchio { display: none; }
  .carburanti small { display: none; }
  .maniglia h2 { font-size: .95rem; }
  .lista li button { padding: 6px 2px; }
  .lista .prezzo { font-size: 1.15rem; }
  .fonte { display: none !important; }
}
@media (min-width: 1440px) {
  body { font-size: 16px; }
  .app { --lato-w: 400px; }
  .lato { padding-left: 20px; padding-right: 20px; }
}
@media (min-width: 2400px) {
  body { font-size: 17px; }
  .app { --lato-w: 440px; }
}

/* --- schermi ultra-larghi (21:9): terza colonna con l'andamento --- */
@media (min-width: 1800px) and (min-aspect-ratio: 2/1) {
  .app { grid-template-columns: var(--lato-w) minmax(0, 1fr) clamp(340px, 16vw, 440px); }
  .panoramica { display: flex; flex-direction: column; gap: 14px; grid-column: 3; grid-row: 1; min-height: 0; overflow-y: auto;
    background: var(--surface); border-left: 1px solid var(--line); padding: 16px 20px; }
}
.panoramica h2 { margin: 0; font: 600 1.05rem/1.2 var(--f-display); text-transform: uppercase; letter-spacing: .05em; }
.panoramica .sotto { color: var(--muted); font-size: .8rem; margin-top: 2px; }
.trend { border: 0; background: transparent; text-align: left; cursor: pointer; padding: 10px 0 6px; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; gap: 0 10px; }
.trend .n { font: 600 .95rem/1.2 var(--f-display); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.trend[aria-pressed="true"] .n { color: var(--accent); }
.trend .v { font: 600 1.45rem/1 var(--f-display); font-variant-numeric: tabular-nums; text-align: right; }
.trend .d { grid-column: 1 / -1; font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; min-height: 1.2em; }
.trend svg { grid-column: 1 / -1; width: 100%; height: 46px; display: block; overflow: visible; margin-top: 4px; color: var(--muted); }
.trend[aria-pressed="true"] svg { color: var(--accent); }
.trend svg .area { fill: currentColor; opacity: .12; }
.trend svg .linea { fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.trend svg .fine { fill: currentColor; stroke: var(--surface); stroke-width: 2; }
.trend svg .guida { stroke: var(--line); stroke-width: 1; }
.trend svg .cursore { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 2; }
.zona { border-top: 1px solid var(--line); padding-top: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
.zona h3 { grid-column: 1 / -1; margin: 0; font: 600 1rem/1.2 var(--f-display); text-transform: uppercase; letter-spacing: .05em; }
.zona div span { display: block; color: var(--muted); font-size: .78rem; }
.zona div b { font: 600 1.3rem/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.zona .largo { grid-column: 1 / -1; color: var(--muted); font-size: .85rem; }

/* --- touch: bersagli più grandi, zoom con le dita --- */
@media (pointer: coarse) {
  .carburanti button { min-height: 44px; }
  .btn-icona { width: 44px; height: 44px; }

}

/* --- scheda del distributore (popup) --- */
.leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.leaflet-popup-content { margin: 12px 14px; font: 14px/1.4 var(--f-body); min-width: 230px; }
.leaflet-container a.leaflet-popup-close-button { color: var(--muted); }
.scheda h3 { margin: 0 0 2px; font: 600 1.15rem/1.15 var(--f-display); text-transform: uppercase; letter-spacing: .03em; padding-right: 14px; }
.scheda .dove { color: var(--muted); font-size: .85rem; margin-bottom: 8px; }

.scheda td { padding: 5px 0; border-top: 1px solid var(--line); vertical-align: top; }
.scheda td:first-child { font: 600 .95rem/1.3 var(--f-display); text-transform: uppercase; letter-spacing: .05em; }
.scheda .p { text-align: right; font: 600 1.2rem/1.1 var(--f-display); }
.scheda .var { text-align: right; font-size: .78rem; color: var(--muted); }
.scheda .scelto td { color: var(--accent); }
.scheda .azioni { margin-top: 10px; display: flex; gap: 8px; }
.scheda .azioni a { flex: 1; text-align: center; background: var(--accent); color: var(--accent-fg); text-decoration: none; border-radius: 8px; padding: 7px; font-weight: 600; }
.scheda .nota { font-size: .75rem; color: var(--muted); margin-top: 6px; }
.leaflet-control-attribution { font-size: 10px; background: color-mix(in srgb, var(--surface) 80%, transparent) !important; color: var(--muted); }
.leaflet-control-attribution a { color: inherit; }
.leaflet-bar a { background: var(--surface); color: var(--fg); border-color: var(--line); }
.leaflet-bar a:hover { background: var(--surface-2); }
.leaflet-top.leaflet-right { top: calc(env(safe-area-inset-top, 0px) + 120px); }
@media (min-width: 700px) { .leaflet-top.leaflet-right { top: calc(env(safe-area-inset-top, 0px) + 140px); } }
@media (prefers-reduced-motion: reduce) { .leaflet-zoom-anim .leaflet-zoom-animated { transition: none !important; } }

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script>
"use strict";
const NOMI = { benzina: "Benzina", gasolio: "Gasolio", gpl: "GPL", metano: "Metano" };
const ZOOM_PREZZI = 12;   // da questo zoom in su si vedono i singoli prezzi
const stato = { carb: "benzina", impianti: [], medie: null, strato: null, comuni: new Map(), soglie: {} };

const $ = (id) => document.getElementById(id);
const euro = (p) => p.toFixed(3).replace(".", ",");
const cent = (d) => (Math.abs(d) * 100).toFixed(1).replace(".", ",").replace(",0", "");
const dataIt = (s) => s ? s.slice(8, 10) + "/" + s.slice(5, 7) : "";
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function leggiPreferenza() { try { return localStorage.getItem("carburante"); } catch { return null; } }
function salvaPreferenza(c) { try { localStorage.setItem("carburante", c); } catch {} }

const mappa = L.map("mappa", { zoomControl: false, preferCanvas: true, minZoom: 5, maxZoom: 18 })
  .setView([42.3, 12.6], 6);
L.control.zoom({ position: "topright" }).addTo(mappa);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(mappa);

function avviso(testo) { const a = $("avviso"); a.textContent = testo || ""; a.hidden = !testo; }

function freccia(delta) {
  if (!delta) return "";
  return delta > 0 ? '<span class="freccia su" aria-label="in aumento">▲</span>'
                   : '<span class="freccia giu" aria-label="in calo">▼</span>';
}

// Fasce di prezzo: il 25% più economico è "economico", il 25% più caro è "caro" (escluse le autostrade)
// Un prezzo è "da verificare" se è molto sotto la media della provincia (segnato dallo script)
// oppure se il gestore non lo aggiorna da più di 8 giorni.
const MAX_GIORNI = 8;
function giorniDa(s) { return Math.round((Date.parse(stato.aggiornato) - Date.parse(s)) / 864e5); }
function motivoDubbio(v) {
  if (!v) return "";
  if (v[4]) return "Molto più basso della media della provincia: potrebbe essere un listino vecchio o un errore del gestore.";
  if (giorniDa(v[3]) > MAX_GIORNI) return `Non aggiornato da ${giorniDa(v[3])} giorni.`;
  return "";
}
function affidabile(i, c = stato.carb) { const v = i.prezzi[c]; return !!v && !motivoDubbio(v); }

function calcolaSoglie() {
  for (const c of Object.keys(NOMI)) {
    const v = stato.impianti.filter((i) => affidabile(i, c) && !i.autostrada).map((i) => i.prezzi[c][0]).sort((a, b) => a - b);
    stato.soglie[c] = v.length ? [v[Math.floor(v.length * .25)], v[Math.floor(v.length * .75)]] : [0, 99];
  }
}
function fascia(p) { const [lo, hi] = stato.soglie[stato.carb]; return p <= lo ? "economico" : p >= hi ? "caro" : ""; }

function iconaPrezzo(i) {
  const [p, d] = i.prezzi[stato.carb];
  if (!affidabile(i)) return L.divIcon({ className: "", iconSize: null, html: `<div class="pin dubbio" title="Prezzo da verificare">${euro(p)}?</div>` });
  return L.divIcon({ className: "", iconSize: null, html: `<div class="pin ${fascia(p)}">${euro(p)}${freccia(d)}</div>` });
}

function iconaGruppo(gruppo) {
  const figli = gruppo.getAllChildMarkers();
  let min = Infinity;
  for (const m of figli) if (affidabile(m.impianto)) min = Math.min(min, m.impianto.prezzi[stato.carb][0]);
  const n = figli.length, lato = n < 50 ? 40 : n < 500 ? 46 : 52;
  return L.divIcon({ className: "", iconSize: null,
    html: `<div class="gruppo" style="width:${lato}px;height:${lato}px"><div>${min < Infinity ? euro(min) : "–"}<span>${n} distr.</span></div></div>` });
}

function scheda(i) {
  const righe = Object.keys(NOMI).filter((c) => i.prezzi[c]).map((c) => {
    const [p, d, dal, com] = i.prezzi[c];
    const v = d ? `${freccia(d)} ${d > 0 ? "+" : "−"}${cent(d)} cent dal ${dataIt(dal)}` : "invariato";
    const dubbio = motivoDubbio(i.prezzi[c]);
    return `<tr class="${c === stato.carb ? "scelto" : ""}${dubbio ? " dubbio" : ""}"><td>${NOMI[c]}</td>
      <td><div class="p">${euro(p)} €</div><div class="var">${v}</div><div class="var">comunicato il ${dataIt(com)}</div>
      ${dubbio ? `<div class="attenzione">Da verificare. ${dubbio}</div>` : ""}</td></tr>`;
  }).join("");
  const dest = `https://www.google.com/maps/dir/?api=1&destination=${i.lat},${i.lon}`;
  return `<div class="scheda"><h3>${esc(i.bandiera || i.nome)}</h3>
    <div class="dove">${esc(i.indirizzo)}, ${esc(i.comune)} (${esc(i.provincia)})</div>
    <table>${righe}</table>
    ${i.autostrada ? '<div class="nota">Impianto autostradale.</div>' : ""}
    <div class="azioni"><a href="${dest}" target="_blank" rel="noopener">Portami qui</a></div></div>`;
}

// Layout attivo: "lato" = barra laterale fissa (PC, tablet/telefono in orizzontale)
const MQ_LATO = matchMedia("(min-width: 1024px), (orientation: landscape) and (max-height: 520px)");
const MQ_LARGO = matchMedia("(min-width: 1800px) and (min-aspect-ratio: 2/1)");

// Quando si apre una scheda la mappa si sposta per non finire sotto i comandi sovrapposti
function margini(m) {
  const pop = m.getPopup(); if (!pop) return;
  if (MQ_LATO.matches) { pop.options.autoPanPaddingTopLeft = [20, 20]; pop.options.autoPanPaddingBottomRight = [20, 20]; return; }
  const testa = document.querySelector(".testa").getBoundingClientRect();
  const pann = $("pannello").getBoundingClientRect();
  const sotto = pann.left < 20 || pann.right > innerWidth / 2 ? innerHeight - pann.top + 16 : 20;
  pop.options.autoPanPaddingTopLeft = [16, testa.bottom + 16];
  pop.options.autoPanPaddingBottomRight = [16, sotto];
}
function apri(m) { stato.strato.zoomToShowLayer(m, () => { margini(m); m.openPopup(); }); }

function disegna() {
  if (stato.strato) mappa.removeLayer(stato.strato);
  const gruppi = L.markerClusterGroup({
    chunkedLoading: true, showCoverageOnHover: false, spiderfyOnMaxZoom: true,
    disableClusteringAtZoom: 16, maxClusterRadius: (z) => (z >= 13 ? 36 : 90), iconCreateFunction: iconaGruppo
  });
  const marcatori = [];
  for (const i of stato.impianti) {
    if (!i.prezzi[stato.carb]) continue;
    const m = L.marker([i.lat, i.lon], { icon: iconaPrezzo(i), title: i.bandiera });
    m.impianto = i;
    m.on("click", () => margini(m));   // prima di bindPopup: aggiorna i margini prima dell'apertura
    m.bindPopup(() => scheda(i), { maxWidth: 300 });
    marcatori.push(m);
  }
  gruppi.addLayers(marcatori);
  stato.strato = gruppi.addTo(mappa);
  aggiornaLista();
  disegnaAndamento();
}

function aggiornaLista() {
  const lista = $("lista");
  if (mappa.getZoom() < 10) {
    lista.innerHTML = '<li class="vuoto">Avvicinati sulla mappa, cerca un comune o usa “vicino a me” per vedere la classifica.</li>';
    $("conteggio").textContent = "";
    return;
  }
  const b = mappa.getBounds();
  const inMappa = stato.impianti.filter((i) => i.prezzi[stato.carb] && b.contains([i.lat, i.lon]));
  const visibili = inMappa.filter((i) => affidabile(i));
  visibili.sort((a, b2) => a.prezzi[stato.carb][0] - b2.prezzi[stato.carb][0]);
  const esclusi = inMappa.length - visibili.length;
  $("conteggio").textContent = `${inMappa.length} nella mappa` + (esclusi ? ` · ${esclusi} da verificare esclusi` : "");
  if (!visibili.length) { lista.innerHTML = '<li class="vuoto">Nessun distributore con questo carburante qui.</li>'; return; }
  lista.innerHTML = visibili.slice(0, MQ_LATO.matches ? 50 : 20).map((i, n) => {
    const [p, d, dal] = i.prezzi[stato.carb];
    const v = d ? `${freccia(d)} ${cent(d)} cent · ${dataIt(dal)}` : "invariato";
    return `<li><button type="button" data-n="${n}"><span class="nome">${esc(i.bandiera || i.nome)}</span>
      <span class="prezzo">${euro(p)}<small>${v}</small></span>
      <span class="dove">${esc(i.indirizzo)}, ${esc(i.comune)}</span></button></li>`;
  }).join("");
  lista.querySelectorAll("button").forEach((btn) => btn.addEventListener("click", () => {
    const i = visibili[+btn.dataset.n];
    const m = stato.strato.getLayers().find((x) => x.impianto === i);
    if (m) apri(m);
  }));
}

// --- colonna 21:9: andamento nazionale per carburante + riepilogo della zona inquadrata ---
function disegnaAndamento() {
  if (!stato.medie || !MQ_LARGO.matches) return;
  const serie = stato.medie.nazionale;
  $("periodo").textContent = `Dal ${dataIt(serie[0].giorno)} al ${dataIt(serie[serie.length - 1].giorno)} · prezzo self (GPL e metano servito)`;
  const W = 320, H = 46;
  $("trend").innerHTML = Object.keys(NOMI).map((c) => {
    const punti = serie.map((g) => g[c]).filter((v) => v != null);
    if (punti.length < 2) return "";
    const min = Math.min(...punti), max = Math.max(...punti), span = max - min || .01;
    const x = (k) => (k / (punti.length - 1)) * W, y = (v) => 4 + (1 - (v - min) / span) * (H - 8);
    const linea = punti.map((v, k) => `${k ? "L" : "M"}${x(k).toFixed(1)},${y(v).toFixed(1)}`).join("");
    const ultimo = punti[punti.length - 1], d = ultimo - punti[0];
    const testo = Math.abs(d) < .0005 ? `stabile in ${punti.length} giorni` : `${d > 0 ? "+" : "−"}${cent(d)} cent in ${punti.length} giorni ${freccia(d)}`;
    return `<button type="button" class="trend" data-c="${c}" aria-pressed="${c === stato.carb}">
      <span class="n">${NOMI[c]}</span><span class="v">${euro(ultimo)}</span>
      <span class="d" data-base="${esc(testo)}">${testo}</span>
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
        <line class="guida" x1="0" x2="${W}" y1="${H - .5}" y2="${H - .5}"/>
        <path class="area" d="${linea}L${W},${H}L0,${H}Z"/><path class="linea" d="${linea}" vector-effect="non-scaling-stroke"/>
        <line class="cursore" x1="0" x2="0" y1="0" y2="${H}" visibility="hidden" vector-effect="non-scaling-stroke"/>
        <circle class="fine" cx="${W}" cy="${y(ultimo).toFixed(1)}" r="4" vector-effect="non-scaling-stroke"/>
      </svg></button>`;
  }).join("");
  // passando sopra al grafico si legge il valore del giorno
  $("trend").querySelectorAll(".trend").forEach((b) => {
    const c = b.dataset.c, svg = b.querySelector("svg"), cur = b.querySelector(".cursore"), d = b.querySelector(".d");
    const giorni = serie.filter((g) => g[c] != null);
    svg.addEventListener("pointermove", (e) => {
      const r = svg.getBoundingClientRect(), k = Math.round(((e.clientX - r.left) / r.width) * (giorni.length - 1));
      const g = giorni[Math.max(0, Math.min(giorni.length - 1, k))];
      const xx = (giorni.indexOf(g) / (giorni.length - 1)) * W;
      cur.setAttribute("x1", xx); cur.setAttribute("x2", xx); cur.setAttribute("visibility", "visible");
      d.textContent = `${dataIt(g.giorno)}: ${euro(g[c])} €`;
    });
    svg.addEventListener("pointerleave", () => { cur.setAttribute("visibility", "hidden"); d.innerHTML = d.dataset.base; });
  });
}
$("trend").addEventListener("click", (e) => {
  const b = e.target.closest(".trend"); if (b && b.dataset.c !== stato.carb) scegliCarburante(b.dataset.c);
});

function aggiornaZona() {
  if (!stato.medie || !MQ_LARGO.matches) return;
  const z = $("zona");
  if (mappa.getZoom() < 9) { z.innerHTML = `<h3>Nella zona inquadrata</h3><div class="largo">Avvicinati sulla mappa per confrontare la zona con la media nazionale.</div>`; return; }
  const b = mappa.getBounds(), c = stato.carb;
  const qui = stato.impianti.filter((i) => i.prezzi[c] && b.contains([i.lat, i.lon]));
  const ok = qui.filter((i) => affidabile(i)).map((i) => i.prezzi[c][0]).sort((a, b2) => a - b2);
  if (!ok.length) { z.innerHTML = `<h3>Nella zona inquadrata</h3><div class="largo">Nessun prezzo di ${NOMI[c].toLowerCase()} affidabile qui.</div>`; return; }
  const media = ok.reduce((a, v) => a + v, 0) / ok.length;
  const naz = stato.medie.nazionale[stato.medie.nazionale.length - 1][c];
  const diff = media - naz;
  z.innerHTML = `<h3>Nella zona inquadrata · ${NOMI[c]}</h3>
    <div><span>Media della zona</span><b>${euro(media)}</b></div>
    <div><span>Rispetto all'Italia</span><b>${Math.abs(diff) < .0005 ? "uguale" : `${diff > 0 ? "+" : "−"}${cent(diff)} cent`}</b></div>
    <div><span>Il più economico</span><b>${euro(ok[0])}</b></div>
    <div><span>Il più caro</span><b>${euro(ok[ok.length - 1])}</b></div>
    <div class="largo">${ok.length} prezzi affidabili${qui.length > ok.length ? `, ${qui.length - ok.length} da verificare esclusi` : ""}. Tra il più economico e il più caro ci sono ${cent(ok[ok.length - 1] - ok[0])} cent al litro: ${((ok[ok.length - 1] - ok[0]) * 50).toFixed(2).replace(".", ",")} € su un pieno da 50 litri.</div>`;
}

function aggiornaMedie() {
  if (!stato.medie) return;
  const s = stato.medie.nazionale, oggi = s[s.length - 1], ieri = s[s.length - 2] || {};
  document.querySelectorAll("#carburanti button").forEach((b) => {
    const c = b.dataset.c, p = oggi[c];
    const d = p && ieri[c] ? p - ieri[c] : 0;
    b.querySelector("small").innerHTML = p ? `media ${euro(p)}${Math.abs(d) >= .0005 ? " " + freccia(d) : ""}` : "–";
  });
}

function scegliCarburante(c) {
  stato.carb = c; salvaPreferenza(c);
  document.querySelectorAll("#carburanti button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.c === c));
  disegna();
  aggiornaZona();
}

$("carburanti").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (b && b.dataset.c !== stato.carb) scegliCarburante(b.dataset.c);
});
$("maniglia").addEventListener("click", () => {
  const p = $("pannello"); const chiuso = p.classList.toggle("chiuso");
  $("maniglia").setAttribute("aria-expanded", !chiuso);
});
mappa.on("moveend", () => { aggiornaLista(); aggiornaZona(); });
new ResizeObserver(() => mappa.invalidateSize()).observe($("mappa"));
MQ_LATO.addEventListener("change", aggiornaLista);
MQ_LARGO.addEventListener("change", () => { disegnaAndamento(); aggiornaZona(); });

function apriPannello() { $("pannello").classList.remove("chiuso"); $("maniglia").setAttribute("aria-expanded", true); }

function vaiAComune(nome) {
  const lista = stato.comuni.get(nome.trim().toLowerCase());
  if (!lista) { avviso(`Nessun distributore trovato a “${nome}”.`); return; }
  avviso(""); apriPannello();
  mappa.fitBounds(L.latLngBounds(lista.map((i) => [i.lat, i.lon])).pad(.15), { maxZoom: 14 });
  $("comune").blur();
}
$("cerca").addEventListener("submit", (e) => { e.preventDefault(); vaiAComune($("comune").value); });
$("comune").addEventListener("change", (e) => { if (stato.comuni.has(e.target.value.trim().toLowerCase())) vaiAComune(e.target.value); });

$("vicino").addEventListener("click", () => {
  if (!navigator.geolocation) { avviso("Il tuo browser non condivide la posizione: cerca il comune."); return; }
  avviso("Cerco la tua posizione…");
  navigator.geolocation.getCurrentPosition(
    (pos) => { avviso(""); apriPannello(); mappa.setView([pos.coords.latitude, pos.coords.longitude], 13); },
    () => avviso("Posizione non disponibile. Controlla i permessi o cerca il comune."),
    { enableHighAccuracy: false, timeout: 10000 });
});

async function carica() {
  try {
    const [ri, rm] = await Promise.all([fetch("data/impianti.json", { cache: "no-cache" }), fetch("data/medie.json", { cache: "no-cache" })]);
    if (!ri.ok) throw new Error(ri.status);
    const dati = await ri.json();
    stato.medie = rm.ok ? await rm.json() : null;
    stato.aggiornato = dati.aggiornato;
    stato.impianti = dati.impianti.map((r) => ({ id: r[0], nome: r[1], bandiera: r[2], indirizzo: r[3],
      comune: r[4], provincia: r[5], lat: r[6], lon: r[7], autostrada: r[8], prezzi: r[9] }));
    for (const i of stato.impianti) {
      const k = i.comune.toLowerCase();
      if (!stato.comuni.has(k)) stato.comuni.set(k, []);
      stato.comuni.get(k).push(i);
    }
    const nomi = [...new Set(stato.impianti.map((i) => `${i.comune}`))].sort((a, b) => a.localeCompare(b, "it"));
    $("comuni").innerHTML = nomi.map((n) => `<option value="${esc(n)}"></option>`).join("");
    $("data").textContent = new Date(dati.aggiornato).toLocaleDateString("it-IT");
    calcolaSoglie();
    aggiornaMedie();
    const pref = leggiPreferenza();
    scegliCarburante(NOMI[pref] ? pref : "benzina");
  } catch (err) {
    $("conteggio").textContent = "";
    avviso("Non riesco a caricare i prezzi. Riprova tra qualche minuto.");
    console.error(err);
  }
}
carica();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

// --- invito a installare l'app (solo su telefoni e tablet, non se è già installata) ---
(() => {
  const ua = navigator.userAgent;
  const ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const android = /Android/.test(ua);
  const installata = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  let chiuso = false; try { chiuso = localStorage.getItem("installa-chiuso") === "1"; } catch {}
  if (installata || chiuso || !(ios || android)) return;
  let richiesta = null;
  window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); richiesta = e; });
  window.addEventListener("appinstalled", () => { $("installa").hidden = true; });
  $("installa").hidden = false;

  function guida() {
    const safari = ios && !/CriOS|FxiOS|EdgiOS|GSA/.test(ua);
    const passi = ios
      ? (safari
        ? ["Tocca il pulsante <b>Condividi</b> (il quadrato con la freccia verso l'alto), in basso o in alto a seconda del modello.",
           "Scorri e scegli <b>Aggiungi alla schermata Home</b>.", "Tocca <b>Aggiungi</b>."]
        : ["Su iPhone l'installazione funziona solo con <b>Safari</b>.",
           "Copia l'indirizzo <b>francesco-cerulli.github.io/pieno-giusto</b> e aprilo in Safari.",
           "Poi tocca <b>Condividi</b> → <b>Aggiungi alla schermata Home</b>."])
      : ["Tocca i <b>tre puntini ⋮</b> in alto a destra.",
         "Scegli <b>Installa app</b> (o <b>Aggiungi a schermata Home</b>).", "Conferma con <b>Installa</b>."];
    const nota = android
      ? "Non vedi i tre puntini o l'opzione? Probabilmente il sito si è aperto dentro la fotocamera o Google Lens: tocca <b>Apri in Chrome</b> (o l'icona del browser) e riprova da lì."
      : "";
    const el = document.createElement("div");
    el.className = "guida"; el.setAttribute("role", "dialog"); el.setAttribute("aria-modal", "true");
    el.innerHTML = `<div><h2>Installa Pieno Giusto</h2><ol>${passi.map((p) => `<li>${p}</li>`).join("")}</ol>
      ${nota ? `<p class="nota">${nota}</p>` : ""}<button type="button">Ho capito</button></div>`;
    el.addEventListener("click", (e) => { if (e.target === el || e.target.tagName === "BUTTON") el.remove(); });
    document.body.appendChild(el);
    el.querySelector("button").focus();
  }
  $("installaSi").addEventListener("click", async () => {
    if (richiesta) {             // Chrome su Android: finestra di installazione ufficiale
      richiesta.prompt();
      const { outcome } = await richiesta.userChoice; richiesta = null;
      if (outcome === "accepted") $("installa").hidden = true;
    } else guida();              // iPhone o browser senza installazione automatica: istruzioni
  });
  $("installaNo").addEventListener("click", () => {
    $("installa").hidden = true; try { localStorage.setItem("installa-chiuso", "1"); } catch {}
  });
})();
</script>
