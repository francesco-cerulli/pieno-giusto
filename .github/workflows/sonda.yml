name: Sonda MIMIT
on: { workflow_dispatch: {} }
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          B=https://carburanti.mise.gov.it/ospzApi
          H='-H Content-Type:application/json -H Accept:application/json -A Mozilla/5.0'
          s() { echo "::warning title=$1::$(echo "$2" | head -c 900 | tr '\n\r' '  ')"; }
          s regioni "$(curl -sS -m 30 $H $B/registry/region)"
          s province "$(curl -sS -m 30 $H "$B/registry/province?regionId=8")"
          s area "$(curl -sS -m 60 $H -X POST $B/search/area -d '{"region":8,"province":"MO","town":null,"priceOrder":"asc","fuelType":"1-x"}')"
          A=$(curl -sS -m 60 $H -X POST $B/search/area -d '{"region":8,"province":"MO","town":null,"priceOrder":"asc","fuelType":"1-x"}')
          s area-n "$(echo "$A" | jq -c '{success, n:(.results|length), uno:.results[0]}' 2>&1)"
          Z=$(curl -sS -m 60 $H -X POST $B/search/zone -d '{"points":[{"lat":44.6458,"lng":10.9255}],"radius":10}')
          s zone-n "$(echo "$Z" | jq -c '{success, n:(.results|length), uno:.results[0]}' 2>&1)"
          Z2=$(curl -sS -m 60 $H -X POST $B/search/zone -d '{"points":[{"lat":44.6458,"lng":10.9255}],"radius":50}')
          s zone50-n "$(echo "$Z2" | jq -c '{success, n:(.results|length), carb:([.results[].fuels[].name]|unique)}' 2>&1)"
