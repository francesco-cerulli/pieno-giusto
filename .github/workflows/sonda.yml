name: Sonda MIMIT
on: { workflow_dispatch: {} }
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          B=https://carburanti.mise.gov.it/ospzApi
          H='-H Content-Type:application/json -H Accept:application/json -A Mozilla/5.0'
          s() { echo "::warning title=$1::$(echo "$2" | head -c 700 | tr '\n\r' '  ')"; }
          for body in \
            '{"region":14,"province":"MO","town":null,"priceOrder":"asc","fuelType":"1-x"}' \
            '{"region":14,"province":"MO","town":null,"priceOrder":"asc"}' \
            '{"region":14,"province":"MO","town":null,"priceOrder":"asc","fuelType":"0"}' \
            '{"region":14,"province":"MO"}' \
            '{"region":14}' ; do
            A=$(curl -sS -m 90 $H -X POST $B/search/area -d "$body")
            s "$body" "$(echo "$A" | jq -c '{success, n:(.results|length), nf:([.results[].fuels|length]|add), carb:([.results[].fuels[].name]|unique|length), uno:.results[0].fuels}' 2>&1)"
          done
