name: Pubblica avvisi

# Pubblica il servizio avvisi (Cloudflare Worker) quando cambia il suo codice, o a mano.
# Crea l'archivio KV la prima volta e salva in docs/avvisi.json l'indirizzo del servizio, letto dall'app.
on:
  push:
    branches: [main]
    paths: ["avvisi/**", ".github/workflows/avvisi.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pubblica-avvisi
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Controlla i segreti
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Mancano i segreti CLOUDFLARE_API_TOKEN e/o CLOUDFLARE_ACCOUNT_ID"; exit 1
          fi

      - name: Installa wrangler
        working-directory: avvisi
        run: npm install --no-audit --no-fund

      - name: Archivio KV (crea se manca)
        working-directory: avvisi
        run: |
          set +e
          LISTA=$(npx wrangler kv namespace list 2>&1)
          echo "$LISTA"
          ID=$(printf '%s' "$LISTA" | node -e '
            let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
              try{const l=JSON.parse(s.slice(s.indexOf("["), s.lastIndexOf("]")+1));const n=l.find(x=>/ISCRITTI$/.test(x.title));console.log(n?n.id:"")}catch{console.log("")}})')
          if [ -z "$ID" ]; then
            OUT=$(npx wrangler kv namespace create ISCRITTI 2>&1); echo "$OUT"
            ID=$(printf '%s' "$OUT" | grep -oE '[0-9a-f]{32}' | head -1)
          fi
          if [ -z "$ID" ]; then
            # i dettagli finiscono nelle annotazioni del run, leggibili anche senza i log completi
            echo "::error title=KV lista::$(printf '%s' "$LISTA" | tr '\n' ' ' | cut -c1-600)"
            echo "::error title=KV crea::$(printf '%s' "$OUT" | tr '\n' ' ' | cut -c1-600)"
            exit 1
          fi
          echo "Archivio KV: $ID"
          sed "s/__KV_ID__/$ID/" wrangler.template.toml > wrangler.toml

      - name: Pubblica il Worker
        working-directory: avvisi
        run: |
          set +e
          OUT=$(npx wrangler deploy 2>&1); echo "$OUT"
          URL=$(printf '%s' "$OUT" | grep -oE 'https://[a-z0-9.-]+\.workers\.dev' | head -1)
          if [ -z "$URL" ]; then echo "::error title=Pubblicazione::$(printf '%s' "$OUT" | tr '\n' ' ' | tail -c 900)"; exit 1; fi
          echo "URL=$URL" >> "$GITHUB_ENV"

      - name: Salva l'indirizzo per l'app
        run: |
          printf '{"url":"%s"}\n' "$URL" > docs/avvisi.json
          git config user.name "aggiornamento-automatico"
          git config user.email "actions@users.noreply.github.com"
          git add docs/avvisi.json
          git diff --cached --quiet || (git commit -m "Indirizzo del servizio avvisi" && git pull --rebase && git push)
