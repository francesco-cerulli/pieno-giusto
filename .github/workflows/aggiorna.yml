name: Aggiorna prezzi carburanti

on:
  schedule:
    # Ogni ora dalle 8:10 alle 20:10 (ora italiana): GitHub a volte ritarda di ore i
    # lavori programmati, così almeno uno parte presto. Se non ci sono dati nuovi non salva nulla.
    - cron: "10 6-18 * * *"
  workflow_dispatch: {}   # pulsante "Run workflow" per lanciarlo a mano

permissions:
  contents: write

concurrency:
  group: aggiorna-dati
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Scarica e archivia i dati del giorno
        run: python scripts/scarica.py

      - name: Elabora i dati per la mappa
        run: python scripts/elabora.py

      - name: Salva nel repository
        run: |
          git config user.name "aggiornamento-automatico"
          git config user.email "actions@users.noreply.github.com"
          git add data docs/data
          git diff --cached --quiet || git commit -m "Dati del $(date +%F)"
          git push
