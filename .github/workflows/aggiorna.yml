name: Aggiorna prezzi carburanti

on:
  schedule:
    # Il MIMIT pubblica in mattinata: provo alle 9:10 e alle 13:10 (ora italiana)
    - cron: "10 7 * * *"
    - cron: "10 11 * * *"
  workflow_dispatch: {}   # pulsante "Run workflow" per lanciarlo a mano

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Scarica e archivia i dati del giorno
        run: python scripts/scarica.py

      - name: Elabora i dati per la mappa
        run: python scripts/elabora.py

      - name: Salva nel repository
        run: |
          git config user.name "aggiornamento-automatico"
          git config user.email "actions@users.noreply.github.com"
          git add data docs/data
          git diff --cached --quiet || git commit -m "Dati del $(date +%F)"
          git push
