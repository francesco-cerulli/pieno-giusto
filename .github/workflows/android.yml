name: App Android

# Costruisce l'app Android (Trusted Web Activity) che apre https://pumpy.it a tutto schermo.
# Risultato: il file .aab da caricare su Play Console e un .apk da installare a mano per prova,
# scaricabili in fondo alla pagina dell'esecuzione (sezione "Artifacts").
#
# Serve un solo segreto del repository: ANDROID_KEYSTORE_PASSWORD (almeno 12 caratteri; niente spazi, " $ ` \\).
# Alla prima esecuzione crea la chiave di caricamento (android/pumpy-upload.keystore), protetta da quella password,
# e la salva nel repository. Non cambiare mai la password dopo: la chiave non si aprirebbe più.
on:
  workflow_dispatch:
    inputs:
      versione:
        description: "Nome della versione mostrato agli utenti (es. 1.0.1). Vuoto = automatico"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]

permissions:
  contents: write

concurrency:
  group: app-android
  cancel-in-progress: false

jobs:
  costruisci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Controlla la password della chiave
        env:
          GREZZA: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          PW="$(printf '%s' "$GREZZA" | tr -d '\r\n')"
          if [ -z "$PW" ]; then
            echo "::error::Manca il segreto ANDROID_KEYSTORE_PASSWORD (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          echo "::add-mask::$PW"
          if [ ${#PW} -lt 12 ]; then
            echo "::error::La password è troppo corta (${#PW} caratteri): ne servono almeno 12."; exit 1
          fi
          case "$PW" in
            *'"'*|*'$'*|*'`'*|*'\'*|*' '*)
              echo "::error::La password contiene un carattere non ammesso: virgolette doppie, dollaro, accento grave, barra rovesciata o spazio."; exit 1;;
          esac
          { echo "PW=$PW"; echo "BUBBLEWRAP_KEYSTORE_PASSWORD=$PW"; echo "BUBBLEWRAP_KEY_PASSWORD=$PW"; } >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Prepara Bubblewrap e Android SDK
        run: |
          npm install -g @bubblewrap/cli@1.27.0
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "build-tools;36.1.0" "platforms;android-36" > /dev/null
          # Bubblewrap riconosce l'SDK solo se trova la cartella "tools" o "bin"
          [ -d "$ANDROID_HOME/tools" ] || [ -d "$ANDROID_HOME/bin" ] || sudo ln -s "$ANDROID_HOME/cmdline-tools/latest/bin" "$ANDROID_HOME/bin"
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json

      - name: Chiave di caricamento (creata solo la prima volta)
        run: |
          if [ ! -f android/pumpy-upload.keystore ]; then
            keytool -genkeypair -keystore android/pumpy-upload.keystore -storetype PKCS12 \
              -alias pumpy -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PW" -keypass "$PW" -dname "CN=Pumpy Labs, O=Pumpy Labs, C=IT"
            echo "Creata una nuova chiave di caricamento."
          fi
          keytool -list -v -keystore android/pumpy-upload.keystore -storepass "$PW" -alias pumpy \
            | sed -n 's/.*SHA256: *//p' | head -1 > /tmp/impronta.txt
          echo "Impronta SHA-256 della chiave di caricamento: $(cat /tmp/impronta.txt)"

      - name: Costruisci
        run: |
          CODICE=$(( ${{ github.run_number }} + 0 ))
          NOME="${{ github.event.inputs.versione }}"
          [ -n "$NOME" ] || NOME="1.0.$CODICE"
          mkdir -p build-android
          jq --argjson c "$CODICE" --arg n "$NOME" '.appVersionCode = $c | .appVersionName = $n' \
            android/twa-manifest.json > build-android/twa-manifest.json
          cp android/pumpy-upload.keystore build-android/
          cd build-android
          bubblewrap update --skipVersionUpgrade < /dev/null
          bubblewrap build --skipPwaValidation < /dev/null
          ls -la *.aab *.apk
          echo "Versione $NOME (codice $CODICE)" >> "$GITHUB_STEP_SUMMARY"

      - name: Collegamento sito ↔ app (assetlinks.json)
        run: |
          mkdir -p docs/.well-known
          touch docs/.nojekyll
          { cat /tmp/impronta.txt; grep -Eo '([0-9A-F]{2}:){31}[0-9A-F]{2}' android/impronte-play.txt 2>/dev/null || true; } \
            | sort -u | jq -R . | jq -s '[{relation:["delegate_permission/common.handle_all_urls"],
                target:{namespace:"android_app",package_name:"com.pumpylabs.pumpy",sha256_cert_fingerprints:.}}]' \
            > docs/.well-known/assetlinks.json
          cat docs/.well-known/assetlinks.json

      - name: Salva chiave e collegamento nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/pumpy-upload.keystore docs/.well-known/assetlinks.json docs/.nojekyll
          if git diff --cached --quiet; then echo "Niente da salvare"; exit 0; fi
          git commit -m "App Android: chiave di caricamento e assetlinks"
          for i in 1 2 3 4 5; do
            git pull --rebase -q && git push -q && exit 0
            sleep 10
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: pumpy-android-${{ github.run_number }}
          path: |
            build-android/app-release-bundle.aab
            build-android/app-release-signed.apk
          retention-days: 30
